name: Materialize MPJE Expansion Batch 1

on:
  push:
    branches:
      - feature/mpje-expansion-batch1
    paths:
      - scripts/build_expansion_batch1.py
      - scripts/fix_expansion_batch1.py
      - .github/workflows/expansion-batch1.yml

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Materialize expansion questions
        run: python scripts/build_expansion_batch1.py

      - name: Apply Batch 1 content fixes
        run: python scripts/fix_expansion_batch1.py

      - name: Regenerate tracked artifacts
        run: python scripts/generate_artifacts.py --write

      - name: Persist generated Batch 1 draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions data/exam_style/question_family_matrix.json scripts/check_structural_patterns.py duplicate_report.json answer_distribution_report.json structural_pattern_report.json site/generated/questions.json
          if git diff --cached --quiet; then
            echo "No materialized changes to commit."
          else
            git commit -m "Materialize MPJE expansion Batch 1 draft"
            git push
          fi

      - name: Validate canonical registries and QA gates
        run: python scripts/validate_all.py

      - name: Run tests
        run: python -m pytest -q
