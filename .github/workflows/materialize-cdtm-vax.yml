name: Materialize CDTM13/VAX04 review (branch only)
on:
  push:
    branches: [feat/cdtm13-16-vax01-04-review-20261030]
    paths: ['.github/workflows/materialize-cdtm-vax.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cdtm13-16-vax01-04-review-20261030
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Inspect original note hashes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          j=json.loads(Path('notes/guide.json').read_text())
          units={u['id']:u for c in j['chapters'] for u in c['units']}
          for id in ['w3-d-9','w3-d-10','w3-c-1','w3-c-2','w3-c-3','w3-c-4']:
              u=units[id]
              print(id, 'stored',u['body_sha256'],'actual',hashlib.sha256(u['body'].encode()).hexdigest(), flush=True)
          PY
      - name: Materialize source-bound notes and corpus
        run: |
          python scripts/build_ultimate_notes.py
          python scripts/build_cdtm_vax_claims.py
          python scripts/build_cdtm_vax_migration.py
          python scripts/build_exam_study.py
          python scripts/build_refresh.py
          python scripts/build_full_corpus_review.py
          python scripts/build_quality_status.py
      - name: Verify exactly reconstructed exports and original protection
        run: |
          python scripts/build_ultimate_notes.py --check
          python scripts/build_cdtm_vax_claims.py --check
          python scripts/build_cdtm_vax_migration.py --check
          python scripts/build_exam_study.py --check
          python scripts/build_refresh.py --check
          python scripts/build_full_corpus_review.py --check
          python scripts/build_quality_status.py --check
          python scripts/verify_representative_protected.py
      - name: Validate focused review and published notes contracts
        run: python -m pytest tests/test_cdtm_vax_review.py tests/test_full_corpus_review.py tests/test_ultimate_notes.py -q
      - name: Verify practice build without changing existing attempts
        run: python scripts/publish_practice.py --output /tmp/mpje-next-cdtm-vax
      - name: Commit verified generated artifacts to source branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            site/notes/content.js site/notes/book.html site/notes/complete-notes.md site/notes/build.json \
            site/notes/study-data.js site/notes/study-build.json site/notes/study.html \
            site/notes/refresh-data.js site/notes/refresh-build.json \
            revisions/notes/protected-migration-cdtm13-vax04.json \
            reports/full-corpus-review/cdtm-vax-note-claims.json \
            reports/full-corpus-review/question-ledger.jsonl \
            reports/full-corpus-review/notes-unit-ledger.jsonl \
            reports/full-corpus-review/notes-claim-ledger.jsonl \
            reports/full-corpus-review/coverage-matrix.json \
            reports/full-corpus-review/progress.json \
            reports/full-corpus-review/pattern-comparison.json \
            reports/full-corpus-review/inventory-definitions.json \
            reports/full-corpus-review/canonical-inventory.json \
            site/practice-expansion/quality-review.html
          if ! git diff --cached --quiet; then
            git commit -m 'materialize: 201 question reviews and six CDTM/VAX notes units'
            git push origin HEAD:feat/cdtm13-16-vax01-04-review-20261030
          fi

# recheck w3-c-3 immutable actual body hash
