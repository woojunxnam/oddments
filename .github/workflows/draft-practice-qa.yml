name: Public draft33 practice QA
on:
  pull_request:
    paths:
      - 'site/draft-practice/**'
      - 'site/index.html'
      - 'site/verified-law/index.html'
      - 'tests/test_draft_practice.*'
      - 'scripts/verify_draft_practice_browser.py'
      - '.github/workflows/draft-practice-qa.yml'
  push:
    branches: ['main']
    paths:
      - 'site/draft-practice/**'
      - 'site/index.html'
      - 'site/verified-law/index.html'
      - 'tests/test_draft_practice.*'
      - 'scripts/verify_draft_practice_browser.py'
      - '.github/workflows/draft-practice-qa.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'workflow_run' && github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

permissions:
  contents: read
jobs:
  draft33:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify draft-only content, grading and backup boundaries
        run: |
          python -m pip install pytest playwright==1.57.0
          python -m pytest tests/test_draft_practice.py -q
          node --check site/draft-practice/app.js
          node --check site/draft-practice/core.js
      - name: Exercise all33 questions over HTTP
        run: |
          python -m playwright install --with-deps chromium
          python scripts/verify_draft_practice_browser.py --output test-results/draft33
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft33-practice-browser-evidence
          path: test-results/draft33/
          retention-days: 14
