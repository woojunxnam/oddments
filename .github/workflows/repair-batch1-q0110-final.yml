name: Repair Batch 1 Q0110 final

on:
  push:
    branches:
      - repair/mpje-expansion-batch1-q0110-final
    paths:
      - .github/workflows/repair-batch1-q0110-final.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: repair/mpje-expansion-batch1-q0110-final
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Assert clean main-derived baseline
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "a09cc6333cc4374ee5f20be8ac596a9ac0b144e1"
          python scripts/validate_all.py
          python -m pytest -q

      - name: Apply distinct Q0110 semantic repair
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text())

          def write(path, obj):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n')

          rule_path = Path('data/rules/ma-cii-opioid-antagonist-offer.json')
          assert not rule_path.exists(), 'new rule ID/path unexpectedly already exists'
          rule = {
              'rule_id': 'MA-CII-OPIOID-ANTAGONIST-OFFER',
              'content_version': 1,
              'content_hash': '',
              'title': 'Schedule II opioid adverse-risk information and opioid-antagonist offer',
              'jurisdiction': 'MA',
              'area': 3,
              'topic': 'Dispensing',
              'subtopic': 'Schedule II opioid safety obligation',
              'rule_summary': 'When a pharmacist dispenses an opioid contained in Schedule II, Massachusetts law requires the pharmacist to inform the patient of the potential adverse risks of the prescription opioid and to offer to dispense an opioid antagonist to the patient and, where applicable, a designee; for a minor patient, the offer is made to the parent or guardian.',
              'exam_relevance': 'Tests the pharmacist-specific duty triggered by dispensing a Schedule II opioid and distinguishes a mandatory risk discussion and antagonist offer from mandatory antagonist acceptance or prescriber-initiated antagonist prescribing.',
              'authority': [
                  {
                      'type': 'STATUTE',
                      'name': 'Massachusetts General Laws c. 94C',
                      'section': '§ 18D',
                      'url': 'https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXV/Chapter94C/Section18D'
                  }
              ],
              'status': 'CURRENT',
              'effective_date': '2024-07-01',
              'supersedes': [],
              'last_verified': '2026-08-14',
              'numeric_facts': [],
              'exceptions': [
                  'Section 18D does not state an exception based on prior opioid experience, possession of an opioid antagonist at home, or absence of a separate antagonist prescription from the opioid prescriber.'
              ],
              'common_confusions': [
                  'Treating the required offer as a requirement that the patient accept or purchase an opioid antagonist.',
                  'Conditioning the pharmacist duty on the prescriber having separately ordered an opioid antagonist.',
                  'Applying the duty to every controlled substance rather than to an opioid contained in Schedule II.'
              ],
              'related_rule_ids': [
                  'MA-NALOXONE',
                  'FED-CS-SCHEDULES'
              ],
              'verification_status': 'PRIMARY_VERIFIED',
              'verification_notes': 'Current M.G.L. c.94C §18D checked on the Massachusetts Legislature and Mass.gov official law pages on 2026-08-14; section added by St. 2024, c.140, §109 and effective July 1, 2024.'
          }
          write(rule_path, rule)

          qpath = Path('data/questions/ma-q-0110.json')
          old = load(qpath)
          assert old['question_id'] == 'MA-Q-0110'
          assert old['verification_status'] == 'AUDIT_PENDING'
          assert old['lifecycle_status'] == 'AUDIT_PENDING'
          assert old['final_adjudication'] is None
          assert old['family_id'] == 'EXP1_0110_CS_PAMPHLET_EXCEPTION'

          q = {
              'question_id': 'MA-Q-0110',
              'family_id': 'EXP1_0110_CII_OPIOID_ANTAGONIST_OFFER',
              'area': 3,
              'topic': 'Dispensing',
              'subtopic': 'Schedule II opioid safety obligation',
              'difficulty': 4,
              'question_type': 'SBA',
              'provenance': 'GEN',
              'source_signal_ids': [],
              'stem': "At pickup, an adult patient is receiving a valid oxycodone prescription. The pharmacist confirms it is a Schedule II opioid. The patient says, 'I already keep unexpired naloxone at home, so we can skip anything else about overdose risk.' Under current Massachusetts law, which response best addresses the pharmacist's specific statutory duty tied to dispensing this oxycodone?",
              'choices': [
                  {
                      'id': 'A',
                      'text': 'Skip both steps because having an opioid antagonist at home satisfies the Massachusetts dispensing requirement.'
                  },
                  {
                      'id': 'B',
                      'text': "Inform the patient of the prescription opioid's potential adverse risks and offer to dispense an opioid antagonist; the patient may decline the offer."
                  },
                  {
                      'id': 'C',
                      'text': 'Require the patient to accept an opioid antagonist before the Schedule II opioid may be dispensed.'
                  },
                  {
                      'id': 'D',
                      'text': 'Make the antagonist offer only when the opioid prescriber has separately ordered one or documented elevated overdose risk.'
                  },
                  {
                      'id': 'E',
                      'text': 'Make the antagonist offer only for a patient who has never previously received a Schedule II opioid.'
                  }
              ],
              'correct_choice_ids': ['B'],
              'explanation': {
                  'core_reasoning': 'M.G.L. c.94C §18D creates a pharmacist-specific duty when dispensing an opioid contained in Schedule II: inform the patient of the prescription opioid’s potential adverse risks and offer to dispense an opioid antagonist. The statute does not make the opioid dispensing contingent on accepting the antagonist and does not state an exception because the patient already possesses naloxone.',
                  'choice_analysis': {
                      'A': 'Prior possession of naloxone is not stated as an exception to the pharmacist’s §18D risk-information and antagonist-offer duties.',
                      'B': 'This matches §18D: the pharmacist must provide the adverse-risk information and make the antagonist offer. An offer does not compel the patient to accept or purchase the antagonist.',
                      'C': 'Section 18D requires an offer, not mandatory acceptance of an opioid antagonist as a condition of receiving the otherwise valid Schedule II opioid.',
                      'D': 'The statutory trigger is the pharmacist dispensing a Schedule II opioid; it is not conditioned on a separate antagonist prescription or a documented high-risk designation from the prescriber.',
                      'E': 'Section 18D does not limit the duty to opioid-naive patients; the relevant trigger is the dispensing of an opioid contained in Schedule II.'
                  },
                  'related_facts': [
                      'Section 18D defines opioid antagonist by FDA approval for treatment of persons experiencing an opioid overdose.',
                      'The pharmacist duty in §18D is distinct from the separate Massachusetts pathways that authorize access to or dispensing of opioid antagonists.'
                  ],
                  'mpje_trap': 'Do not turn an obligation to inform and offer into a requirement that the patient accept naloxone, and do not invent an exception merely because the patient already has naloxone.'
              },
              'rule_ids': [
                  'MA-CII-OPIOID-ANTAGONIST-OFFER',
                  'FED-CS-SCHEDULES'
              ],
              'drug_ids': ['oxycodone'],
              'reasoning_steps': [
                  'Identify oxycodone as an opioid contained in Schedule II',
                  'Recognize that dispensing the Schedule II opioid triggers M.G.L. c.94C §18D',
                  'Separate the mandatory adverse-risk information and antagonist offer from mandatory antagonist acceptance',
                  'Reject an unstated exception based on the patient already possessing naloxone'
              ],
              'verification_status': 'AUDIT_PENDING',
              'lifecycle_status': 'AUDIT_PENDING',
              'last_legal_review': '2026-08-14',
              'audits': [],
              'duplicate_review_status': 'PENDING',
              'independent_audit_status': 'PENDING',
              'final_adjudication': None,
              'development_fixture': True
          }
          write(qpath, q)

          matrix_path = Path('data/exam_style/question_family_matrix.json')
          matrix = load(matrix_path)
          matches = [i for i, f in enumerate(matrix['families']) if f['family_id'] == 'EXP1_0110_CS_PAMPHLET_EXCEPTION']
          assert len(matches) == 1, matches
          matrix['families'][matches[0]] = {
              'family_id': 'EXP1_0110_CII_OPIOID_ANTAGONIST_OFFER',
              'area': 3,
              'topic': 'Dispensing',
              'subtopic': 'Schedule II opioid safety obligation',
              'primary_rule_ids': ['MA-CII-OPIOID-ANTAGONIST-OFFER'],
              'secondary_rule_ids': ['FED-CS-SCHEDULES'],
              'drug_required': True,
              'scenario_types': ['dispensing', 'patient counseling'],
              'common_traps': [
                  'treating the required antagonist offer as mandatory acceptance',
                  'inventing an exception because the patient already possesses naloxone',
                  'conditioning the pharmacist duty on a separate antagonist order from the prescriber'
              ],
              'target_difficulties': [4, 5],
              'target_item_types': ['SBA'],
              'max_questions_in_final_bank': 2,
              'current_candidate_count': 1,
              'current_released_count': 0
          }
          write(matrix_path, matrix)
          print('Applied distinct Q0110 §18D semantic repair and new current rule')
          PY

          python scripts/update_content_hashes.py
          python scripts/generate_artifacts.py --write

      - name: Validate repaired bank and uniqueness boundary
        run: |
          python scripts/validate_all.py
          python -m pytest -q
          PYTHONPATH=scripts python - <<'PY'
          import json
          from pathlib import Path

          q = json.loads(Path('data/questions/ma-q-0110.json').read_text())
          assert q['family_id'] == 'EXP1_0110_CII_OPIOID_ANTAGONIST_OFFER'
          assert q['question_type'] == 'SBA'
          assert q['correct_choice_ids'] == ['B']
          assert q['rule_ids'] == ['MA-CII-OPIOID-ANTAGONIST-OFFER', 'FED-CS-SCHEDULES']
          assert q['drug_ids'] == ['oxycodone']
          assert q['verification_status'] == q['lifecycle_status'] == 'AUDIT_PENDING'
          assert q['audits'] == []
          assert q['final_adjudication'] is None

          rule = json.loads(Path('data/rules/ma-cii-opioid-antagonist-offer.json').read_text())
          assert rule['status'] == 'CURRENT'
          assert rule['verification_status'] == 'PRIMARY_VERIFIED'
          assert len(rule['content_hash']) == 64

          all_questions = []
          for path in sorted(Path('data/questions').glob('*.json')):
              all_questions.append(json.loads(path.read_text()))
          users = [x['question_id'] for x in all_questions if 'MA-CII-OPIOID-ANTAGONIST-OFFER' in x.get('rule_ids', [])]
          assert users == ['MA-Q-0110'], users
          assert all('18D' not in json.dumps(x) for x in all_questions if x['question_id'] != 'MA-Q-0110')

          allow = json.loads(Path('site/generated/preview_allowlist.json').read_text())
          assert len(allow['question_ids']) == 86, len(allow['question_ids'])
          assert 'MA-Q-0098' in allow['question_ids']
          assert 'MA-Q-0110' not in allow['question_ids']

          released = 0
          for n in range(91, 131):
              item = json.loads(Path(f'data/questions/ma-q-{n:04d}.json').read_text())
              if item['verification_status'] == 'RELEASED' and item['lifecycle_status'] == 'RELEASED':
                  released += 1
          assert released == 39, released
          print('Q0110 distinct repair boundary PASS: unique §18D family, preview=86, Batch1 released=39/40')
          PY

      - name: Commit repair and remove one-shot workflow
        run: |
          rm .github/workflows/repair-batch1-q0110-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repair: rebuild Q0110 with distinct Schedule II opioid duty"
          git push origin HEAD:repair/mpje-expansion-batch1-q0110-final

      - name: Prove deterministic committed state
        run: |
          python scripts/update_content_hashes.py
          python scripts/generate_artifacts.py --write
          python scripts/validate_all.py
          python -m pytest -q
          git diff --exit-code
