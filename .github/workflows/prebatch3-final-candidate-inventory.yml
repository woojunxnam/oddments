name: Pre-Batch3 Final Candidate Inventory

on:
  push:
    branches:
      - analysis/pre-batch3-coverage-final

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact post-Batch2 analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify exact sources
        shell: bash
        run: |
          set -euo pipefail
          POST=beeb96d71768b9fb275bdb0005d9cd012e0d1328
          PREP=b459aa8cc554e000077e5acadd8a05217dc1731f
          git merge-base --is-ancestor "$POST" HEAD
          git fetch --no-tags origin +refs/heads/analysis/mpje-coverage-debt-prep:refs/remotes/origin/analysis/mpje-coverage-debt-prep
          test "$(git rev-parse refs/remotes/origin/analysis/mpje-coverage-debt-prep)" = "$PREP"
          git show "$PREP:audits/coverage/2026-08-17/PRE-BATCH3-ATOMIC-COVERAGE-PROXY.json" > /tmp/PRE-BATCH3-ATOMIC-COVERAGE-PROXY.json
          echo "source verification: PASS"

      - name: Build refreshed candidate maturity and capacity
        run: python scripts/build_prebatch3_final_candidate_inventory.py

      - name: Validate repository unchanged canonically
        run: python scripts/validate_all.py

      - name: Run full tests
        run: python -m pytest -q

      - name: Prove generated artifacts current
        run: python scripts/generate_artifacts.py --write && git diff --exit-code -- generated site/generated/questions.json

      - name: Commit analysis artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/coverage/2026-08-17/FINAL-PRE-BATCH3-CANDIDATE-MATURITY.json \
                  audits/coverage/2026-08-17/FINAL-PRE-BATCH3-MOCK-CAPACITY.json
          git commit -m "analysis: refresh post-Batch2 coverage candidates"
          git push origin HEAD:analysis/pre-batch3-coverage-final
