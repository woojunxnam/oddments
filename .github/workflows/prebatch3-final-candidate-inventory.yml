name: Pre-Batch3 Final Coverage Gate

on:
  push:
    branches:
      - analysis/pre-batch3-coverage-final

permissions:
  contents: write

jobs:
  coverage-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact post-Batch2 analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify exact sources
        shell: bash
        run: |
          set -euo pipefail
          POST=beeb96d71768b9fb275bdb0005d9cd012e0d1328
          PREP=b459aa8cc554e000077e5acadd8a05217dc1731f
          git merge-base --is-ancestor "$POST" HEAD
          git fetch --no-tags origin +refs/heads/analysis/mpje-coverage-debt-prep:refs/remotes/origin/analysis/mpje-coverage-debt-prep
          test "$(git rev-parse refs/remotes/origin/analysis/mpje-coverage-debt-prep)" = "$PREP"
          git show "$PREP:audits/coverage/2026-08-17/PRE-BATCH3-ATOMIC-COVERAGE-PROXY.json" > /tmp/PRE-BATCH3-ATOMIC-COVERAGE-PROXY.json
          echo "source verification: PASS"

      - name: Rebuild candidate maturity and capacity
        run: python scripts/build_prebatch3_final_candidate_inventory.py

      - name: Apply semantic 46-atomic adjudication
        run: python scripts/finalize_prebatch3_coverage_gate.py

      - name: Validate repository
        shell: bash
        run: python scripts/validate_all.py | tee /tmp/validate.log

      - name: Run full tests
        shell: bash
        run: python -m pytest -q | tee /tmp/pytest.log

      - name: Prove generated artifacts current
        run: python scripts/generate_artifacts.py --write && git diff --exit-code -- generated site/generated/questions.json

      - name: Enforce analysis-only boundary
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          lines = subprocess.check_output(["git", "status", "--porcelain=v1", "--untracked-files=all"], text=True).splitlines()
          paths = [line[3:].split(" -> ")[-1] for line in lines]
          allowed_prefix = "audits/coverage/2026-08-17/FINAL-PRE-BATCH3-"
          unexpected = [p for p in paths if not p.startswith(allowed_prefix)]
          if unexpected:
              raise SystemExit(f"unexpected final-gate writes: {unexpected}")
          print(f"analysis boundary PASS: {len(paths)} artifact paths")
          PY

      - name: Commit final gate artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/coverage/2026-08-17/FINAL-PRE-BATCH3-*.json \
                  audits/coverage/2026-08-17/FINAL-PRE-BATCH3-COVERAGE-DEBT.md
          if git diff --cached --quiet; then
            echo "final gate artifacts already current"
          else
            git commit -m "analysis: finalize pre-Batch3 coverage gate"
          fi
          git push origin HEAD:analysis/pre-batch3-coverage-final
