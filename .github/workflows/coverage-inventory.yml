name: MPJE Coverage Debt Inventory

on:
  push:
    branches: [analysis/mpje-coverage-debt-prep]
    paths: ['.github/workflows/coverage-inventory.yml']

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/mpje-coverage-debt-prep
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate full-bank inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter,defaultdict
          from pathlib import Path

          questions=[]
          for p in sorted(Path('data/questions').glob('ma-q-*.json')):
              q=json.loads(p.read_text())
              questions.append(q)
          assert len(questions)==210, len(questions)
          assert [q['question_id'] for q in questions]==[f'MA-Q-{i:04d}' for i in range(1,211)]

          area=Counter(str(q['area']) for q in questions)
          qtype=Counter(q['question_type'] for q in questions)
          diff=Counter(str(q['difficulty']) for q in questions)
          topic=defaultdict(Counter)
          subtopic=defaultdict(Counter)
          family=defaultdict(Counter)
          rule=Counter(); drug=Counter()
          topic_qids=defaultdict(list); subtopic_qids=defaultdict(list); family_qids=defaultdict(list)
          for q in questions:
              a=str(q['area'])
              t=q.get('topic') or 'UNSPECIFIED'
              s=q.get('subtopic') or 'UNSPECIFIED'
              f=q.get('family_id') or 'UNSPECIFIED'
              topic[a][t]+=1; subtopic[a][s]+=1; family[a][f]+=1
              topic_qids[(a,t)].append(q['question_id'])
              subtopic_qids[(a,s)].append(q['question_id'])
              family_qids[(a,f)].append(q['question_id'])
              for rid in q.get('rule_ids',[]): rule[rid]+=1
              for did in q.get('drug_ids',[]): drug[did]+=1

          bp={1:22,2:33,3:24,4:21}
          expected={str(a):{'weight_percent':w,'expected_at_210':210*w/100,'actual':area[str(a)],'delta_from_weighted_count':area[str(a)]-210*w/100} for a,w in bp.items()}

          def nested(counter_map,qid_map):
              out={}
              for a,c in sorted(counter_map.items(), key=lambda x:int(x[0])):
                  out[a]=[]
                  for name,count in sorted(c.items(),key=lambda x:(-x[1],x[0])):
                      out[a].append({'name':name,'count':count,'question_ids':qid_map[(a,name)]})
              return out

          payload={
              'source_sha':'1c85163367a82c06061f3d5be3f7d05c3748bca2',
              'question_count':len(questions),
              'blueprint':'CURRENT_PRE_2027-03-01_MPJE',
              'area_distribution':expected,
              'question_type_distribution':dict(sorted(qtype.items())),
              'difficulty_distribution':dict(sorted(diff.items())),
              'topics_by_area':nested(topic,topic_qids),
              'subtopics_by_area':nested(subtopic,subtopic_qids),
              'families_by_area':nested(family,family_qids),
              'rule_usage':dict(sorted(rule.items(),key=lambda x:(-x[1],x[0]))),
              'drug_usage':dict(sorted(drug.items(),key=lambda x:(-x[1],x[0]))),
              'unique_counts':{
                  'topics':sum(len(x) for x in topic.values()),
                  'subtopics':sum(len(x) for x in subtopic.values()),
                  'families':sum(len(x) for x in family.values()),
                  'rules_used':len(rule),
                  'drugs_used':len(drug),
              },
              'note':'Inventory only. Does not claim NABP subcompetency coverage until semantic mapping is adjudicated.'
          }
          out=Path('audits/coverage/2026-08-17/PRE-BATCH3-COVERAGE-INVENTORY.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'question_count':210,'area_distribution':expected,'unique_counts':payload['unique_counts']},indent=2))
          PY
      - name: Commit analysis artifact only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coverage-inventory-bot'
          git config user.email 'coverage-inventory-bot@users.noreply.github.com'
          git rm .github/workflows/coverage-inventory.yml
          git add audits/coverage/2026-08-17/PRE-BATCH3-COVERAGE-INVENTORY.json
          git commit -m 'analysis(mpje): add pre-Batch3 coverage inventory'
          git push origin HEAD:analysis/mpje-coverage-debt-prep
