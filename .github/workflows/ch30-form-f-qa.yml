name: Chapter 30 Form F release QA
on:
  pull_request:
    paths:
      - 'site/mpje-side-notes/exam-simulation-30/**'
      - 'drafts/mpje/form-f/**'
      - 'scripts/verify_ch30_form_f_browser.py'
      - '.github/workflows/ch30-form-f-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-form-f:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Form F scripts and manifest
        run: |
          for file in site/mpje-side-notes/exam-simulation-30/form-f-*.js site/mpje-side-notes/exam-simulation-30/mock-120-f.js site/mpje-side-notes/exam-simulation-30/mock-review-tools-f.js; do node --check "$file"; done
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test 390px and 1280px Form F exam flows
        run: |
          python -m http.server 8175 --bind 127.0.0.1 --directory site > /tmp/ch30-f-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python scripts/verify_ch30_form_f_browser.py --base-url http://127.0.0.1:8175/
