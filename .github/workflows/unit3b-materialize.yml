name: Unit3B exact-scope materialization
on:
  push:
    branches: ['feat/unit3b-personnel-20261029']
permissions:
  contents: write
jobs:
  materialize:
    if: startsWith(github.event.head_commit.message, 'build(mpje): materialize Unit 3B')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate exact allowlisted artifacts and preserve old snapshots
        run: |
          python -m pip install -r requirements-dev.txt scikit-learn==1.8.0
          python scripts/materialize_unit3b.py
      - name: Test actual generated tree
        run: |
          python scripts/build_full_corpus_review.py --check
          python scripts/build_quality_status.py --check
          python scripts/build_representative_rewrites.py --check
          python scripts/build_representative_audit_ledger.py --check
          python scripts/build_ultimate_notes.py --check
          python scripts/build_exam_study.py --check
          python scripts/build_refresh.py --check
          python -m pytest -q
          node --check site/practice-expansion/quality-core.js
          node --check site/notes/notes.js
          python scripts/publish_practice.py --output /tmp/mpje-unit3b-site
      - name: Commit generated artifacts to this feature branch without force
        env:
          SOURCE_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          test "$BRANCH_NAME" = "feat/unit3b-personnel-20261029"
          current=$(git ls-remote origin "refs/heads/$BRANCH_NAME" | cut -f1)
          test "$current" = "$SOURCE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "build(mpje): generated Unit3B artifacts"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
