name: Apply Batch 1 v3 remediation

on:
  push:
    branches:
      - repair/mpje-expansion-batch1-v3
    paths:
      - .github/workflows/apply-batch1-v3.yml
      - scripts/apply_expansion_batch1_v3.py
      - scripts/polish_expansion_batch1_v3.py

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v3 branch
        uses: actions/checkout@v6
        with:
          ref: repair/mpje-expansion-batch1-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Freeze public and released Wave 1 hashes
        run: |
          sha256sum site/generated/preview_allowlist.json > /tmp/preview.sha
          for id in 0092 0095 0096 0115 0118 0119 0120 0122 0123 0124 0130; do
            sha256sum "data/questions/ma-q-${id}.json"
          done > /tmp/wave1.sha
          cat /tmp/preview.sha
          cat /tmp/wave1.sha

      - name: Extend rule authority schema for federal statutes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('schemas/rule.schema.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          enum = d['$defs']['authority']['properties']['type']['enum']
          if 'FEDERAL_STATUTE' not in enum:
              enum.append('FEDERAL_STATUTE')
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Apply v3 semantic remediation
        run: python scripts/apply_expansion_batch1_v3.py

      - name: Polish answer-cue balance
        run: python scripts/polish_expansion_batch1_v3.py

      - name: Recompute canonical content and dependency hashes
        run: python scripts/update_content_hashes.py

      - name: Regenerate QA and development artifacts
        run: python scripts/generate_artifacts.py --write

      - name: Prove public Wave 1 boundary unchanged
        run: |
          sha256sum -c /tmp/preview.sha
          for id in 0092 0095 0096 0115 0118 0119 0120 0122 0123 0124 0130; do
            sha256sum "data/questions/ma-q-${id}.json"
          done > /tmp/wave1-after.sha
          diff -u /tmp/wave1.sha /tmp/wave1-after.sha
          python - <<'PY'
          import json
          from pathlib import Path
          allow = json.loads(Path('site/generated/preview_allowlist.json').read_text())
          assert len(allow['question_ids']) == 58, len(allow['question_ids'])
          print('public preview remains:', len(allow['question_ids']))
          PY

      - name: Validate repository
        run: python scripts/validate_all.py

      - name: Run tests
        run: python -m pytest -q

      - name: Check v3 scope and generated QA reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('repair_specs/exp1_v3/replacement_plan.json').read_text())
          assert len(plan['semantic_replacements']) == 27
          dup = json.loads(Path('duplicate_report.json').read_text())
          structural = json.loads(Path('structural_pattern_report.json').read_text())
          answer = json.loads(Path('answer_distribution_report.json').read_text())
          print('semantic replacements:', len(plan['semantic_replacements']))
          print('duplicate findings:', dup.get('finding_count'))
          print('structural findings:', structural.get('finding_count'))
          print('answer distribution severity:', answer.get('severity'))
          PY

      - name: Commit successful v3 remediation
        run: |
          rm .github/workflows/apply-batch1-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repair: rebuild unreleased Batch 1 questions v3"

      - name: Deterministic post-commit proof
        run: |
          python scripts/generate_artifacts.py --write
          git diff --exit-code
          python scripts/validate_all.py
          python -m pytest -q

      - name: Push v3 remediation
        run: git push origin HEAD:repair/mpje-expansion-batch1-v3
