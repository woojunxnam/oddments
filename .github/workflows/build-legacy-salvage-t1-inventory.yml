name: Build Legacy Salvage T1 Inventory

on:
  push:
    branches:
      - remediation/pre-batch3-legacy-salvage-t1

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify exact post-Batch2 ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=beeb96d71768b9fb275bdb0005d9cd012e0d1328
          git merge-base --is-ancestor "$BASE" HEAD
          python - <<'PY'
          import subprocess
          base = "beeb96d71768b9fb275bdb0005d9cd012e0d1328"
          changed = set(subprocess.check_output(["git", "diff", "--name-only", f"{base}..HEAD"], text=True).splitlines())
          expected = {
              "scripts/build_legacy_salvage_t1_inventory.py",
              ".github/workflows/build-legacy-salvage-t1-inventory.yml",
          }
          if changed != expected:
              raise SystemExit(f"unexpected pre-inventory branch drift: {sorted(changed)}")
          print("exact remediation ancestry: PASS")
          PY

      - name: Build exact Tranche 1 inventory
        run: python scripts/build_legacy_salvage_t1_inventory.py

      - name: Validate repository
        run: python scripts/validate_all.py

      - name: Run full tests
        run: python -m pytest -q

      - name: Prove generated artifacts current
        run: python scripts/generate_artifacts.py --write && git diff --exit-code -- generated site/generated/questions.json

      - name: Commit inventory only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/remediation/2026-08-17/T1-LEGACY-SALVAGE-INVENTORY.json
          git commit -m "remediation: freeze Tranche 1 current-state inventory"
          git push origin HEAD:remediation/pre-batch3-legacy-salvage-t1
