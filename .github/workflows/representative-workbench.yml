name: Representative revision workbench
on:
  push:
    branches: ['feat/representative-rewrite-20261028']
    paths: ['.github/workflows/representative-workbench.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5bd6b02c7ea8a5c6731871fa6e330ac6795fd36
      - name: Preserve exact source worktree
        shell: python
        run: |
          import pathlib,zipfile,json,hashlib
          root=pathlib.Path('.');out=pathlib.Path('/tmp/representative-review');out.mkdir()
          with zipfile.ZipFile(out/'repository.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and '.git' not in p.parts:z.write(p,str(p))
          (out/'manifest.json').write_text(json.dumps({'base':'b5bd6b02c7ea8a5c6731871fa6e330ac6795fd36','sha256':hashlib.sha256((out/'repository.zip').read_bytes()).hexdigest()},indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: representative-revision-base
          path: /tmp/representative-review
          retention-days: 7
