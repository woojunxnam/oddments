name: Apply Legacy Salvage T1 Repairs

on:
  push:
    branches:
      - remediation/pre-batch3-legacy-salvage-t1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify repair starting boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=14e66b224e92d619f0244b81ae376653a6869992
          git merge-base --is-ancestor "$BASE" HEAD
          python - <<'PY'
          import subprocess
          base = "14e66b224e92d619f0244b81ae376653a6869992"
          changed = set(subprocess.check_output(["git", "diff", "--name-only", f"{base}..HEAD"], text=True).splitlines())
          expected = {
              "scripts/apply_legacy_salvage_t1_repairs.py",
              "scripts/polish_legacy_salvage_t1_structural.py",
              ".github/workflows/apply-legacy-salvage-t1-repairs.yml",
          }
          if changed != expected:
              raise SystemExit(f"unexpected editor-setup drift: {sorted(changed)}")
          print("repair starting boundary: PASS")
          PY

      - name: Apply editor repairs
        run: python scripts/apply_legacy_salvage_t1_repairs.py

      - name: Polish structural answer patterns
        run: python scripts/polish_legacy_salvage_t1_structural.py

      - name: Regenerate deterministic artifacts
        run: python scripts/generate_artifacts.py --write

      - name: Validate repository
        shell: bash
        run: python scripts/validate_all.py | tee /tmp/validate.log

      - name: Run full tests
        shell: bash
        run: python -m pytest -q | tee /tmp/pytest.log

      - name: Enforce editor write boundary
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          lines = subprocess.check_output(["git", "status", "--porcelain=v1", "--untracked-files=all"], text=True).splitlines()
          paths = [line[3:].split(" -> ")[-1] for line in lines]
          repair_ids = {9,15,16,17,40,75,76,78,81,85,86,87,88}
          def allowed(p):
              m = re.fullmatch(r"data/questions/ma-q-(\d{4})\.json", p)
              if m:
                  return int(m.group(1)) in repair_ids
              if p == "data/rules/ma-counseling-documentation.json":
                  return True
              if p == "data/exam_style/question_family_matrix.json":
                  return True
              if p == "audits/remediation/2026-08-17/T1-EDITOR-REVIEW.json":
                  return True
              if p in {"site/generated/questions.json"}:
                  return True
              if p.startswith("generated/") and p.endswith(".json"):
                  return True
              return False
          unexpected = sorted(p for p in paths if not allowed(p))
          if unexpected:
              raise SystemExit(f"unexpected editor writes: {unexpected}")
          print(f"editor write boundary: PASS ({len(paths)} paths)")
          PY

      - name: Commit repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "remediation: repair Tranche 1 legacy salvage candidate"

      - name: Prove exact-head artifact freshness
        run: python scripts/generate_artifacts.py --write && git diff --exit-code

      - name: Push repaired candidate
        run: git push origin HEAD:remediation/pre-batch3-legacy-salvage-t1
