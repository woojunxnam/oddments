name: Export MPJE Expansion Batch 1 audit inputs

on:
  push:
    branches:
      - feature/mpje-expansion-batch1
    paths:
      - .github/workflows/export-expansion-batch1-audits.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Export GPT legal INITIAL_BATCH
        run: >-
          python scripts/export_audit_batch.py
          --auditor GPT
          --review-type LEGAL_VERIFICATION
          --audit-scope INITIAL_BATCH
          --start 90
          --count 40
          --output audits/initial/2026-08-14/GPT-LEGAL-EXP1-Q0091-0130.json

      - name: Export GPT realism INITIAL_BATCH
        run: >-
          python scripts/export_audit_batch.py
          --auditor GPT
          --review-type REALISM_REVIEW
          --audit-scope INITIAL_BATCH
          --start 90
          --count 40
          --output audits/initial/2026-08-14/GPT-REALISM-EXP1-Q0091-0130.json

      - name: Export Claude legal INITIAL_BATCH
        run: >-
          python scripts/export_audit_batch.py
          --auditor CLAUDE
          --review-type LEGAL_VERIFICATION
          --audit-scope INITIAL_BATCH
          --start 90
          --count 40
          --output audits/initial/2026-08-14/CLAUDE-LEGAL-EXP1-Q0091-0130.json

      - name: Commit frozen audit inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/initial/2026-08-14
          git commit -m "Freeze Expansion Batch 1 audit inputs"
          git push
