name: QA

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.event_name == 'workflow_run' && github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js for browser shuffle contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Validate canonical registries and QA gates
        run: python scripts/validate_all.py

      - name: Run tests
        run: python -m pytest -q

      - name: Prove tracked generated artifacts are current
        run: python scripts/generate_artifacts.py --write && git diff --exit-code
