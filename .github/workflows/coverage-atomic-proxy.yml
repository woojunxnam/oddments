name: MPJE Atomic Competency Coverage Proxy

on:
  push:
    branches: [analysis/mpje-coverage-debt-prep]
    paths: ['.github/workflows/coverage-atomic-proxy.yml']

permissions:
  contents: write

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/mpje-coverage-debt-prep
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build conservative candidate evidence lists
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path

          qs=[]
          for p in sorted(Path('data/questions').glob('ma-q-*.json')):
              q=json.loads(p.read_text())
              blob=' '.join([
                  q.get('topic',''),q.get('subtopic',''),q.get('stem',''),q.get('family_id',''),
                  ' '.join(q.get('rule_ids',[])),
                  ' '.join(c.get('text','') for c in q.get('choices',[])),
                  q.get('explanation',{}).get('core_reasoning',''),
                  ' '.join(q.get('reasoning_steps',[])),
              ]).lower()
              qs.append((q,blob))
          assert len(qs)==210

          # Proxy patterns are deliberately broad; candidates are evidence for later human semantic adjudication, not a PASS decision.
          specs=[
            ('1.1a','PIC/pharmacist qualifications, duties, limits, conditions',1,[r'pharmacist-in-charge',r'\bpic\b',r'pharmacist duties?',r'pharmacist responsibility',r'pharmacist supervision']),
            ('1.1b','Non-pharmacist personnel qualifications, duties, limits, conditions',1,[r'technician',r'pharmacy intern',r'certified-tech',r'licensed-tech',r'\bptt\b',r'non-pharmacist']),
            ('1.2a','Personnel licensure/registration/certification, exams, internship, competency, renewal',1,[r'licensure',r'license renewal',r'continuing education',r'\bce\b',r'intern hours?',r'certification',r'credential']),
            ('1.2b','Personnel disciplinary classifications/processes',1,[r'disciplin',r'revocation',r'suspension',r'sanction',r'probation']),
            ('1.2c','Impairment/inability-to-practice reporting or participation programs',1,[r'impair',r'reasonable skill and safety',r'inability to practice',r'rehabilitation program',r'professional recovery',r'diversion program']),

            ('2.1a','Drug-use requirements, limitations, restrictions',2,[r'initial supply',r'seven-day',r'7-day',r'indication',r'eligible condition',r'drug use',r'quantity limit',r'restriction']),
            ('2.1b','Practitioner authority/scope/registration to prescribe, dispense, administer',2,[r'prescriber authority',r'practitioner authority',r'scope of practice',r'mcsr',r'dea registration',r'collaborative',r'cdtm',r'pharmacist prescribing',r'prescriber direction']),
            ('2.1c','Issuing non-controlled prescriptions/orders',2,[r'non-controlled',r'noncontrolled',r'schedule vi',r'expedited partner therapy',r'\bept\b',r'prescription construction']),
            ('2.1d','Issuing controlled prescriptions/orders',2,[r'controlled prescription',r'schedule ii prescription',r'schedule iii',r'schedule iv',r'schedule v',r'electronic prescribing',r'emergency schedule ii']),
            ('2.1e','Practitioner refill authorization limits',2,[r'refill authority',r'refills?',r'authorize refills?',r'no refills?',r'refill timing']),
            ('2.2','Pharmacist/non-pharmacist drug administration conditions',2,[r'pharmacist administration',r'administer',r'vaccin',r'long-acting injectable',r'\blai\b',r'naltrexone-er',r'vivitrol']),
            ('2.3a','Counseling or offer-to-counsel requirements',2,[r'counsel',r'offer to counsel']),
            ('2.3b','Documentation of counseling/offer',2,[r'document.*counsel',r'counsel.*document',r'documenting.*offer']),
            ('2.4','Returning or reusing drugs',2,[r'return(ed|ing)? medication',r'reuse',r'redispens',r'return.*drug',r'drug.*return']),
            ('2.5a','Public-health quality/safety regulations and agencies',2,[r'public health',r'naloxone',r'expedited partner therapy',r'quality',r'patient safety',r'cq[i|e]']),
            ('2.5b','Patient/health-record confidentiality',2,[r'confidential',r'privacy',r'hipaa',r'patient record.*privacy',r'health record']),

            ('3.1','Legitimate medical purpose/restrictions and corresponding responsibility',3,[r'legitimate medical purpose',r'corresponding responsibility',r'red flag',r'valid prescription']),
            ('3.2','Prescription/order transfer by authorized personnel',3,[r'prescription transfer',r'transfer requirements?',r'transfer.*pharmac']),
            ('3.3a','Prospective drug utilization review',3,[r'prospective review',r'prospective drug utilization',r'\bdur\b']),
            ('3.3b','PMP reporting/access',3,[r'masspat',r'prescription monitoring program',r'\bpmp\b',r'dispensing-data submission',r'reportable dispensing']),
            ('3.4','Exceptions to dispensing/refilling',3,[r'partial fill',r'partial filling',r'emergency',r'fax exception',r'exception.*dispens',r'remainder deadline',r'pharmacy inability']),
            ('3.5','Labeling of dispensed drugs',3,[r'labeling',r'label',r'prescription identity']),
            ('3.6','Packaging of dispensed drugs',3,[r'packaging',r'package integrity',r'compliance packaging',r'repackag']),
            ('3.7','Drug-product conditions prohibiting dispensing',3,[r'recall',r'storage excursion',r'expired',r'adulterat',r'misbrand',r'product condition',r'prohibit.*dispens']),
            ('3.8a','Nonprescription product dispensing/administration',3,[r'pseudoephedrine',r'nonprescription',r'otc',r'hypodermic',r'syringe',r'naloxone']),
            ('3.8b','Nonprescription drug/device labeling',3,[r'nonprescription.*label',r'otc.*label',r'device.*label']),
            ('3.8c','Nonprescription/behind-counter packaging or repackaging',3,[r'nonprescription.*packag',r'otc.*packag',r'behind-the-counter',r'repackag']),
            ('3.8d','Dispensing-restricted nonprescription products',3,[r'pseudoephedrine',r'cmea',r'restricted nonprescription',r'behind-the-counter',r'hypodermic']),

            ('4.1a','Ordering/acquisition and records',4,[r'ordering',r'acquisition',r'form 222',r'csos',r'procurement',r'supplier']),
            ('4.1b','Distribution and records',4,[r'distribution',r'reverse distribution',r'wholesale',r'transfer.*stock',r'disposition']),
            ('4.2a','Non-dispensing pharmacy/practice-setting operations records',4,[r'record retention',r'required records',r'operations',r'closure',r'cq[i|e]',r'qre',r'reporting']),
            ('4.2b','Possession/storage/handling of non-hazardous drugs',4,[r'storage',r'handling',r'package integrity',r'controlled stock security',r'physical security']),
            ('4.2c','Hazardous-drug training/possession/handling/storage/disposal',4,[r'hazardous',r'usp.?800',r'chemotherapy',r'cytotoxic']),
            ('4.2d','Non-pharmacist personnel access to drugs',4,[r'technician.*stock',r'stocking',r'non-pharmacist.*access',r'add.*access',r'emergency-kit loader']),
            ('4.2e','Controlled-substance inventories',4,[r'biennial inventory',r'initial inventory',r'controlled substance inventory',r'counting method']),
            ('4.3','Delivery of drugs',4,[r'delivery',r'courier',r'mail',r'common carrier',r'lock box',r'lockbox']),
            ('4.4','Permitted/mandated product selection',4,[r'generic interchange',r'product selection',r'substitution',r'interchangeable',r'biosimilar']),
            ('4.5a','Sterile compounding',4,[r'sterile compound',r'usp.?797',r'parenteral compounding',r'compounded sterile']),
            ('4.5b','Nonsterile compounding',4,[r'nonsterile compound',r'non-sterile compound',r'usp.?795']),
            ('4.5c','Hazardous compounding',4,[r'hazardous compound',r'usp.?800']),
            ('4.5d','Non-hazardous compounding',4,[r'nonhazardous compound',r'non-hazardous compound']),
            ('4.6','Centralized prescription processing / central fill',4,[r'central fill',r'centralized prescription',r'centralized processing']),
            ('4.7a','Practice-setting/business registration/licensure/certification/permitting',4,[r'pharmacy licen',r'facility licen',r'practice setting.*licen',r'permit',r'registration']),
            ('4.7b','Practice-setting license/registration renewal or reinstatement',4,[r'pharmacy.*renew',r'facility.*renew',r'reinstatement']),
            ('4.7c','Practice-setting inspection requirements',4,[r'inspection',r'inspect.*pharmacy',r'preoperational']),
            ('4.7d','Practice-setting disciplinary actions',4,[r'pharmacy.*disciplin',r'facility.*disciplin',r'permit.*suspend',r'license.*revok']),
          ]
          assert len(specs)==46, len(specs)

          rows=[]
          for cid,label,area,patterns in specs:
              cand=[]
              for q,blob in qs:
                  if q['area'] != area: continue
                  hits=[pat for pat in patterns if re.search(pat,blob,re.I)]
                  if hits:
                      cand.append({'question_id':q['question_id'],'topic':q.get('topic'),'subtopic':q.get('subtopic'),'family_id':q.get('family_id'),'matched_patterns':hits})
              rows.append({'atomic_id':cid,'label':label,'area':area,'candidate_count':len(cand),'candidate_questions':cand,'proxy_status':'ZERO' if not cand else ('THIN' if len(cand)==1 else 'CANDIDATES_PRESENT')})

          payload={
              'source_sha':'1c85163367a82c06061f3d5be3f7d05c3748bca2',
              'question_count':210,
              'method':'Broad keyword/provenance candidate scan over area/topic/subtopic/stem/family/rules/choices/core_reasoning/reasoning_steps. Proxy only; every atomic competency requires semantic human adjudication before a coverage PASS.',
              'atomic_count':46,
              'zero_candidate_count':sum(r['candidate_count']==0 for r in rows),
              'thin_candidate_count':sum(r['candidate_count']==1 for r in rows),
              'rows':rows,
          }
          p=Path('audits/coverage/2026-08-17/PRE-BATCH3-ATOMIC-COVERAGE-PROXY.json')
          p.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          compact={'zero':[{'atomic_id':r['atomic_id'],'label':r['label']} for r in rows if r['candidate_count']==0], 'thin':[{'atomic_id':r['atomic_id'],'label':r['label'],'question_ids':[x['question_id'] for x in r['candidate_questions']]} for r in rows if r['candidate_count']==1], 'counts':{r['atomic_id']:r['candidate_count'] for r in rows}}
          Path('audits/coverage/2026-08-17/PRE-BATCH3-ATOMIC-COVERAGE-GAPS.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'zero_candidate_count':payload['zero_candidate_count'],'thin_candidate_count':payload['thin_candidate_count'],'zero':compact['zero'],'thin':compact['thin']},indent=2))
          PY
      - name: Commit proxy artifacts only
        shell: bash
        run: |
          git config user.name coverage-proxy-bot
          git config user.email coverage-proxy-bot@users.noreply.github.com
          git rm .github/workflows/coverage-atomic-proxy.yml
          git add audits/coverage/2026-08-17/PRE-BATCH3-ATOMIC-COVERAGE-PROXY.json audits/coverage/2026-08-17/PRE-BATCH3-ATOMIC-COVERAGE-GAPS.json
          git commit -m 'analysis(mpje): add atomic competency coverage proxy'
          git push origin HEAD:analysis/mpje-coverage-debt-prep
