name: Refresh development snapshot
on:
  push:
    branches: ['feat/notes-refresh-20261027']
    paths: ['.github/workflows/refresh-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=/tmp/refresh-repository.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: refresh-repository
          path: /tmp/refresh-repository.zip
          retention-days: 3
