name: Deploy MPJE preview to Pages
on:
  push:
    branches: ['main']
    paths:
      - 'site/**'
      - 'practice_expansion/**'
      - 'scripts/publish_practice.py'
      - 'scripts/practice_quality.py'
      - 'scripts/representative_quality.py'
      - 'scripts/build_refresh.py'
      - 'scripts/verify_ch30_browser.py'
      - 'scripts/verify_ch30_form_d_browser.py'
      - 'scripts/verify_ch30_mixes_browser.py'
      - 'scripts/verify_ch30_revision_history_browser.py'
      - 'notes/refresh/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Playwright Chromium 1.57 supports Ubuntu 24.04; ubuntu-latest now maps to unsupported 26.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Chapter 30 topic inventory
        run: |
          python scripts/update_ch30_topic_inventory.py --write
          git diff --exit-code -- site/mpje-side-notes/exam-simulation-30/topic-inventory.json
          python scripts/update_ch30_topic_inventory.py --check
      - name: Build enabled practice collections
        run: |
          python scripts/build_refresh.py --check
          python scripts/publish_practice.py --output /tmp/mpje-public-site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/mpje-public-site
      # GitHub's artifact listing may lag a successful upload in the same run.
      - name: Allow uploaded Pages artifact to become visible
        run: sleep 20
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual public practice payload and main-page entry
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: python
        run: |
          import json, os, time, urllib.request
          from pathlib import Path
          config=json.loads(Path('site/practice-expansion/publication.json').read_text())
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          suffix='?release='+os.environ['GITHUB_SHA']
          def read(path):
              req=urllib.request.Request(base+path+suffix,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode()
          for attempt in range(12):
              try:
                  manifest=json.loads(read('practice-expansion/build.json'))
                  assert manifest['status']=='PUBLISHED_PRACTICE' and manifest['published_question_count']==config['published_total']
                  html=read('practice-expansion/')
                  assert html==Path('/tmp/mpje-public-site/practice-expansion/index.html').read_text(), 'Published practice bytes differ from this build'
                  assert 'id="ack"' not in html and 'MA-EXP-1024' in html and 'MA-CASE-1152' in html
                  assert 'const initialQuestion=byId.get(location.hash.slice(1))||filtered[0]||(!selectedNoteId?Q[0]:null);' in html
                  assert 'if(initialQuestion)openQuestion(initialQuestion);else openFilteredQuestion();' in html
                  main=read('')
                  assert f"{config['published_total']:,}문항 연습 시작" in main
                  assert [x['count'] for x in manifest['collections']]==[config['question_count']]+[x['question_count'] for x in config['additional_banks']]
                  assert 'id="chaos"' in html and 'MA-REV-0096' in html
                  selection=json.loads(Path(config['representative_selection']['path']).read_text())
                  assert manifest['quality_selection']['recommended']==selection['stats']['recommended']
                  assert manifest['representative_revision']['new_ids']==selection['new_ids']
                  assert manifest['representative_revision']['replacements']==selection['replacements']
                  assert 'practice-expansion/?bank=rewrite' in main
                  assert 'practice-expansion/?bank=plus' in main and 'practice-expansion/?bank=quality' in main
                  assert read('practice-expansion/quality-core.js')==Path('site/practice-expansion/quality-core.js').read_text()
                  assert read('practice-expansion/quality-review.html')==Path('site/practice-expansion/quality-review.html').read_text()
                  print(f"Production practice verified byte-for-byte: {config['published_total']} questions; {selection['stats']['recommended']} default; {len(selection['new_ids'])} separate-ID revisions; previous2272 and unrestricted Chaos10 preserved.")
                  break
              except Exception:
                  if attempt==11:raise
                  time.sleep(5)
      - name: Verify actual public refresh assets and shared navigation
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: python
        run: |
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          suffix='?refresh='+os.environ['GITHUB_SHA']
          expected=json.loads(Path('site/notes/refresh-build.json').read_text())
          def get(path):
              req=urllib.request.Request(base+path+suffix,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:return r.read()
          files=['notes/refresh-build.json','notes/refresh-data.js','notes/refresh-core.js',
                 'notes/refresh.js','notes/refresh.css','notes/notes.js',
                 'assets/learning-tools.js','assets/learning-tools.css']
          for attempt in range(12):
              try:
                  for path in files:
                      assert hashlib.sha256(get(path)).digest()==hashlib.sha256((Path('site')/path).read_bytes()).digest(),path
                  for path in ['', 'notes/', 'notes/book.html', 'practice-expansion/', 'practice-expansion/research.html', 'practice-expansion/quality-review.html']:
                      text=get(path).decode()
                      assert text.count('src="'+('' if not path else '../')+'assets/learning-tools.js"')==1,path
                  assert 'notes/#refresh' in get('').decode()
                  assert 'refresh-data.js' in get('notes/').decode()
                  print('Production refresh assets verified byte-for-byte; all six checked pages have shared navigation.')
                  print(json.dumps(expected,ensure_ascii=False))
                  break
              except Exception:
                  if attempt==11:raise
                  time.sleep(5)
      - name: Verify published draft33 assets match merged source
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: python
        run: |
          import hashlib, os, time, urllib.request
          from pathlib import Path
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          suffix = '?ui_release=' + os.environ['GITHUB_SHA']
          paths = ['draft-practice/', 'draft-practice/app.js',
                   'draft-practice/core.js', 'draft-practice/styles.css',
                   'draft-practice/questions.json']
          for attempt in range(12):
              try:
                  for path in paths:
                      expected = (Path('/tmp/mpje-public-site') / (path + 'index.html' if path.endswith('/') else path)).read_bytes()
                      request = urllib.request.Request(base + path + suffix, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          actual = response.read()
                      assert hashlib.sha256(actual).digest() == hashlib.sha256(expected).digest(), path
                  print('Five draft-practice assets match the actual published HTTPS site.')
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
      - name: Exercise actual published draft33 browser behavior
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python scripts/verify_draft_practice_browser.py --base-url "$PAGE_URL" --output test-results/draft33-public
      - name: Exercise published Chapter 30 question review and random quiz
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_ch30_browser.py --base-url "$PAGE_URL"
      - name: Exercise published Chapter 30 full-length mock exam behavior
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_ch30_mock120_browser.py --base-url "$PAGE_URL"
      - name: Verify the published Form C assets and isolated exam behavior
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib, os, time, urllib.request
          from pathlib import Path
          base=os.environ['PAGE_URL'].rstrip('/')+'/mpje-side-notes/exam-simulation-30/'
          paths=['mock-120-c.html','mock-120-c.js','form-c-questions.js','form-c-manifest.js']
          for attempt in range(12):
              try:
                  for path in paths:
                      request=urllib.request.Request(base+path+'?release='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(request,timeout=30) as response: actual=response.read()
                      expected=(Path('site/mpje-side-notes/exam-simulation-30')/path).read_bytes()
                      assert hashlib.sha256(actual).digest()==hashlib.sha256(expected).digest(),path
                  print('Published Form C assets match merged main exactly.')
                  break
              except Exception:
                  if attempt==11:raise
                  time.sleep(5)
          PY
          python scripts/verify_ch30_form_c_browser.py --base-url "$PAGE_URL"
      - name: Verify published Form D, mixed exams and revision archives match this release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: python
        run: |
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          base = os.environ['PAGE_URL'].rstrip('/') + '/mpje-side-notes/exam-simulation-30/'
          paths = ['mock-120-d.html', 'mock-120-d.js', 'form-d-questions.js', 'form-d-manifest.js',
                   'mock-120-mixes.html', 'mock-120-mixes.js', 'mixed-forms.js',
                   'bank-revisions.js', 'mock-version-history.js', 'mock-review-tools.js',
                   'questions.js', 'mock-forms.js']
          evidence = Path('test-results/ch30-public')
          evidence.mkdir(parents=True, exist_ok=True)
          for attempt in range(12):
              try:
                  verified = {}
                  for path in paths:
                      request = urllib.request.Request(base + path + '?release=' + os.environ['GITHUB_SHA'],
                                                       headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          actual = response.read()
                      expected = (Path('/tmp/mpje-public-site/mpje-side-notes/exam-simulation-30') / path).read_bytes()
                      digest = hashlib.sha256(actual).hexdigest()
                      assert digest == hashlib.sha256(expected).hexdigest(), path
                      verified[path] = digest
                  report = {'passed': True, 'release': os.environ['GITHUB_SHA'], 'page_url': os.environ['PAGE_URL'],
                            'verified_sha256': verified}
                  (evidence / 'published-assets.json').write_text(json.dumps(report, indent=2) + '\n')
                  print('Published D/mixed exam files and historical archives match this deployment exactly.')
                  break
              except Exception as error:
                  (evidence / 'published-assets.json').write_text(json.dumps({
                      'passed': False, 'release': os.environ['GITHUB_SHA'], 'page_url': os.environ['PAGE_URL'],
                      'attempt': attempt + 1, 'error': str(error)}, indent=2) + '\n')
                  if attempt == 11:
                      raise
                  time.sleep(5)
      - name: Exercise published Form D exam behavior
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          mkdir -p test-results/ch30-public
          python scripts/verify_ch30_form_d_browser.py --base-url "$PAGE_URL" 2>&1 | tee test-results/ch30-public/form-d.log
      - name: Exercise published mixed exams and focused review
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python scripts/verify_ch30_mixes_browser.py --base-url "$PAGE_URL" 2>&1 | tee test-results/ch30-public/mixed-exams.log
      - name: Verify historical exam preservation on the published site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python scripts/verify_ch30_revision_history_browser.py --base-url "$PAGE_URL" --output test-results/ch30-public/revision-history.json 2>&1 | tee test-results/ch30-public/revision-history.log
      - name: Retain published Chapter 30 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-ch30-exam-evidence
          path: test-results/ch30-public/
          retention-days: 14
      - name: Retain published draft33 verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-draft33-browser-evidence
          path: test-results/draft33-public/
          retention-days: 14
