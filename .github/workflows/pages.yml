name: Deploy MPJE preview to Pages
on:
  push:
    branches: ['main']
    paths:
      - 'site/**'
      - 'practice_expansion/**'
      - 'scripts/publish_practice.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build both enabled practice collections
        run: python scripts/publish_practice.py --output /tmp/mpje-public-site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/mpje-public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual public practice payload and main-page entry
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: python
        run: |
          import json, os, time, urllib.request
          from pathlib import Path
          config=json.loads(Path('site/practice-expansion/publication.json').read_text())
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          suffix='?release='+os.environ['GITHUB_SHA']
          def read(path):
              req=urllib.request.Request(base+path+suffix,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode()
          for attempt in range(12):
              try:
                  manifest=json.loads(read('practice-expansion/build.json'))
                  assert manifest['status']=='PUBLISHED_PRACTICE' and manifest['published_question_count']==config['published_total']
                  html=read('practice-expansion/')
                  assert 'id="ack"' not in html and 'MA-EXP-1024' in html and 'MA-CASE-1152' in html
                  assert 'openQuestion(byId.get(location.hash.slice(1))||filtered[0]||Q[0])' in html
                  assert '2,176문항 연습 시작' in read('')
                  assert [x['count'] for x in manifest['collections']]==[1024,1152]
                  assert 'practice-expansion/?bank=plus' in read('')
                  print('Production page verified: 2176 online questions, both collections; no draft gate.')
                  break
              except Exception:
                  if attempt==11:raise
                  time.sleep(5)
