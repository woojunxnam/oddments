name: MPJE exam-study QA and publication check
on:
  push:
    paths:
      - 'notes/study/**'
      - 'site/notes/**'
      - 'site/assets/learning-tools.js'
      - 'site/index.html'
      - 'scripts/build_exam_study.py'
      - 'scripts/verify_exam_study*.py'
      - 'tests/test_exam_study.py'
      - '.github/workflows/exam-study-qa.yml'
  pull_request:
    paths:
      - 'notes/study/**'
      - 'site/notes/**'
      - 'site/assets/learning-tools.js'
      - 'site/index.html'
      - 'scripts/build_exam_study.py'
      - 'scripts/verify_exam_study*.py'
      - 'tests/test_exam_study.py'
      - '.github/workflows/exam-study-qa.yml'
  workflow_run:
    workflows: ['Deploy MPJE preview to Pages']
    types: [completed]
permissions:
  contents: read
jobs:
  study:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source fidelity and learning contracts
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.57.0
          python scripts/build_exam_study.py --check
          python scripts/build_refresh.py --check
          python scripts/build_ultimate_notes.py --check
          python -m pytest tests/test_exam_study.py tests/test_refresh.py tests/test_ultimate_notes.py tests/test_casebank_plus.py tests/test_practice_expansion_integration.py practice_expansion/2026-10-23/tests/test_expansion.py -q
          node --check site/notes/study.js
          node --check site/assets/learning-tools.js
          python scripts/publish_practice.py --output /tmp/mpje-exam-site
      - name: Real HTTP and existing-learning regressions
        run: |
          python -m playwright install --with-deps chromium
          python scripts/verify_exam_study.py --site /tmp/mpje-exam-site
          python scripts/verify_refresh_browser.py --site /tmp/mpje-exam-site
          python scripts/verify_notes_browser.py
          python scripts/verify_public_practice.py --site /tmp/mpje-exam-site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exam-study-browser-evidence
          path: test-results
          retention-days: 7
  production:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual published study layer
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python scripts/verify_exam_study_production.py
