name: Freeze Pre-Batch3 Legacy Salvage T1 R2 V4

on:
  push:
    branches:
      - freeze/pre-batch3-legacy-salvage-t1-r2-v4
    paths:
      - .github/workflows/freeze-pre-batch3-legacy-salvage-t1-r2-v4.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact V4 freeze branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: freeze/pre-batch3-legacy-salvage-t1-r2-v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify exact candidate ancestry and tooling-only boundary
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=5c048473356292f855c14fe53c78273c11d2334a
          git fetch origin repair/pre-batch3-legacy-salvage-t1-r2
          test "$(git rev-parse origin/repair/pre-batch3-legacy-salvage-t1-r2)" = "$CANDIDATE"
          test "$(git merge-base "$CANDIDATE" HEAD)" = "$CANDIDATE"
          python - <<'PY'
          import subprocess
          candidate = '5c048473356292f855c14fe53c78273c11d2334a'
          changed = set(subprocess.check_output(['git','diff','--name-only',f'{candidate}...HEAD'], text=True).splitlines())
          expected = {
              'scripts/freeze_legacy_salvage_t1_r2_v4.py',
              'scripts/verify_prebatch3_t1_r2_v4_freeze.py',
              '.github/workflows/freeze-pre-batch3-legacy-salvage-t1-r2-v4.yml',
          }
          if changed != expected:
              raise SystemExit(f'unexpected V4 starting diff: {sorted(changed)}')
          print('V4 tooling-only starting boundary: PASS')
          PY

      - name: Generate sanitized Auditor H packages
        run: python scripts/freeze_legacy_salvage_t1_r2_v4.py

      - name: Enforce sanitized package write boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          candidate = '5c048473356292f855c14fe53c78273c11d2334a'
          tracked = set(subprocess.check_output(['git','diff','--name-only',candidate], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          expected_tooling = {
              'scripts/freeze_legacy_salvage_t1_r2_v4.py',
              'scripts/verify_prebatch3_t1_r2_v4_freeze.py',
              '.github/workflows/freeze-pre-batch3-legacy-salvage-t1-r2-v4.yml',
          }
          expected_inputs = {
              'audits/remediation/2026-08-18/GPT-H-BLIND-QUESTIONS-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json',
              'audits/remediation/2026-08-18/GPT-H-LEGAL-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json',
              'audits/remediation/2026-08-18/GPT-H-REALISM-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json',
              'audits/remediation/2026-08-18/PRE-BATCH3-LEGACY-SALVAGE-T1-R2-CLEAN-FREEZE-V4-MANIFEST.json',
          }
          if tracked != expected_tooling:
              raise SystemExit(f'V4 modified tracked candidate content: {sorted(tracked)}')
          if untracked != expected_inputs:
              raise SystemExit(f'unexpected V4 generated inputs: {sorted(untracked)}')
          print('V4 sanitized write boundary: PASS')
          PY

      - name: Governance mechanical verification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_prebatch3_t1_r2_v4_freeze.py | tee /tmp/v4-verifier.txt
          grep -Fx 'governance-attested T1 r2 v4 mechanical verification: PASS' /tmp/v4-verifier.txt

      - name: Repository validation
        run: python scripts/validate_all.py

      - name: Full tests
        run: python -m pytest -q

      - name: Generated-artifact freshness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_artifacts.py --write
          git diff --exit-code

      - name: Write governance Phase 0 attestation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('audits/remediation/2026-08-18')
          manifest_path = root / 'PRE-BATCH3-LEGACY-SALVAGE-T1-R2-CLEAN-FREEZE-V4-MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          blind = root / 'GPT-H-BLIND-QUESTIONS-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json'
          legal = root / 'GPT-H-LEGAL-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json'
          realism = root / 'GPT-H-REALISM-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json'
          attestation = {
              'attestation_type': 'GOVERNANCE_PRECERTIFIED_PHASE0',
              'date': '2026-08-18',
              'candidate_branch': manifest['candidate_branch'],
              'candidate_sha': manifest['candidate_sha'],
              'freeze_branch': manifest['freeze_branch'],
              'auditor_instance_reserved': manifest['auditor_instance_reserved'],
              'question_ids': manifest['question_ids'],
              'question_hashes': manifest['question_hashes'],
              'dependency_snapshots': manifest['dependency_snapshots'],
              'package_sha256': {
                  str(blind): sha(blind),
                  str(legal): sha(legal),
                  str(realism): sha(realism),
                  str(manifest_path): sha(manifest_path),
              },
              'mechanical_verifier': 'PASS',
              'repository_validation': 'PASS',
              'full_tests': 'PASS',
              'generated_artifact_freshness': 'PASS',
              'auditor_phase0_required': False,
              'auditor_start_phase': 'PHASE_1_BLIND_SOLVE',
              'safe_content_statement': 'This attestation contains hashes/dependency metadata only and no canonical keyed answers or explanations.',
          }
          out = root / 'PRE-BATCH3-T1-R2-V4-GOVERNANCE-PHASE0-ATTESTATION.json'
          out.write_text(json.dumps(attestation, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(out)
          PY

      - name: Enforce final freeze diff boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          candidate = '5c048473356292f855c14fe53c78273c11d2334a'
          changed = set(subprocess.check_output(['git','diff','--name-only',candidate], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          expected_tracked = {
              'scripts/freeze_legacy_salvage_t1_r2_v4.py',
              'scripts/verify_prebatch3_t1_r2_v4_freeze.py',
              '.github/workflows/freeze-pre-batch3-legacy-salvage-t1-r2-v4.yml',
          }
          expected_untracked = {
              'audits/remediation/2026-08-18/GPT-H-BLIND-QUESTIONS-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json',
              'audits/remediation/2026-08-18/GPT-H-LEGAL-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json',
              'audits/remediation/2026-08-18/GPT-H-REALISM-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json',
              'audits/remediation/2026-08-18/PRE-BATCH3-LEGACY-SALVAGE-T1-R2-CLEAN-FREEZE-V4-MANIFEST.json',
              'audits/remediation/2026-08-18/PRE-BATCH3-T1-R2-V4-GOVERNANCE-PHASE0-ATTESTATION.json',
          }
          if changed != expected_tracked:
              raise SystemExit(f'unexpected final tracked paths: {sorted(changed)}')
          if untracked != expected_untracked:
              raise SystemExit(f'unexpected final untracked paths: {sorted(untracked)}')
          print('V4 final freeze boundary: PASS')
          PY

      - name: Commit sanitized packages and governance attestation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            audits/remediation/2026-08-18/GPT-H-BLIND-QUESTIONS-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json \
            audits/remediation/2026-08-18/GPT-H-LEGAL-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json \
            audits/remediation/2026-08-18/GPT-H-REALISM-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json \
            audits/remediation/2026-08-18/PRE-BATCH3-LEGACY-SALVAGE-T1-R2-CLEAN-FREEZE-V4-MANIFEST.json \
            audits/remediation/2026-08-18/PRE-BATCH3-T1-R2-V4-GOVERNANCE-PHASE0-ATTESTATION.json
          git commit -m "freeze: add governance-attested T1 R2 auditor H inputs"

      - name: Push final V4 freeze
        run: git push origin HEAD:freeze/pre-batch3-legacy-salvage-t1-r2-v4
