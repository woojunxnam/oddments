name: Ultimate notes workbench
on:
  push:
    branches: ["feat/mpje-ultimate-notes-20261023"]
    paths: [".github/workflows/notes-workbench.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Package public repository and fetch official source documents
        shell: python
        run: |
          import pathlib, zipfile, urllib.request, urllib.parse, json, hashlib
          from html.parser import HTMLParser
          out = pathlib.Path('/tmp/notes-workbench'); out.mkdir()
          with zipfile.ZipFile(out / 'repository.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for p in pathlib.Path('.').rglob('*'):
                  if p.is_file() and '.git' not in p.parts:
                      z.write(p, str(p))
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href','')
                      if href: self.links.append(href)
          index = 'https://www.mass.gov/lists/guidelines-for-pharmacists-to-prescribe-oral-prep-pep-sti-treatment-and-doxypep'
          urls = [index,
              'https://www.mass.gov/doc/2023-04-continuity-of-care-pdf/download',
              'https://www.mass.gov/doc/2021-04-continuing-education-ce-requirements-pdf/download',
              'https://www.mass.gov/doc/247-cmr-9-professional-practice-standards/download',
              'https://www.mass.gov/doc/policy-15-05-prescribing-practices-policy-and-guidelines-amended-january-14-2021/download']
          manifest=[]
          def fetch(url, n):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; public-source-study-review)'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      b=r.read(12_000_000); ct=r.headers.get('Content-Type',''); final=r.url
                  name=f'source-{n:02d}' + ('.pdf' if b.startswith(b'%PDF') else '.docx' if b.startswith(b'PK') else '.html')
                  (out/name).write_bytes(b)
                  manifest.append({'url':url,'final_url':final,'file':name,'content_type':ct,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
                  return b
              except Exception as e:
                  manifest.append({'url':url,'error':str(e)}); return b''
          body=fetch(index,0)
          p=Links(); p.feed(body.decode('utf-8',errors='replace'))
          for href in p.links:
              u=urllib.parse.urljoin(index,href)
              if '/doc/' in u and '/download' in u and urllib.parse.urlparse(u).netloc == 'www.mass.gov':
                  if u not in urls: urls.append(u)
          for n,u in enumerate(urls[1:],1): fetch(u,n)
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-notes-workbench
          path: /tmp/notes-workbench
          retention-days: 3
