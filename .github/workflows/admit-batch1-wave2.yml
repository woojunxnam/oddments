name: Admit Batch 1 Wave 2

on:
  push:
    branches:
      - repair/mpje-expansion-batch1-v3
    paths:
      - .github/workflows/admit-batch1-wave2.yml

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v3 branch
        uses: actions/checkout@v6
        with:
          ref: repair/mpje-expansion-batch1-v3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify pre-admission repository
        run: |
          python scripts/validate_all.py
          python -m pytest -q

      - name: Admit only the 27 Issue 27 pass questions
        run: |
          python scripts/admit_batch1_wave2.py
          python scripts/generate_artifacts.py --write

      - name: Validate Wave 2 release boundary
        run: |
          python scripts/validate_all.py
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path

          allow = json.loads(Path('site/generated/preview_allowlist.json').read_text())
          ids = set(allow['question_ids'])
          assert len(ids) == 85, len(ids)
          assert 'MA-Q-0098' not in ids
          assert 'MA-Q-0110' not in ids

          released = []
          for number in range(91, 131):
              q = json.loads(Path(f'data/questions/ma-q-{number:04d}.json').read_text())
              if q['verification_status'] == 'RELEASED' and q['lifecycle_status'] == 'RELEASED':
                  released.append(q['question_id'])
          assert len(released) == 38, len(released)

          for qid in ('MA-Q-0098', 'MA-Q-0110'):
              q = json.loads(Path(f"data/questions/ma-q-{qid[-4:]}.json").read_text())
              assert q['verification_status'] == 'AUDIT_PENDING'
              assert q['lifecycle_status'] == 'AUDIT_PENDING'
              assert q['final_adjudication'] is None
          print('Wave 2 boundary PASS: preview=85, Batch1 RELEASED=38, quarantined=2')
          PY

      - name: Commit admission and remove one-shot workflow
        run: |
          rm .github/workflows/admit-batch1-wave2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: admit Batch 1 Wave 2 27-question pass set"
          git push origin HEAD:repair/mpje-expansion-batch1-v3

      - name: Prove committed artifacts are deterministic
        run: |
          python scripts/generate_artifacts.py --write
          python scripts/validate_all.py
          python -m pytest -q
          git diff --exit-code
