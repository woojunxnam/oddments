name: Batch 2 Adjudicated Repair V1

on:
  push:
    branches: [repair/mpje-expansion-batch2-v1]
    paths: ['.github/workflows/batch2-repair-v1.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/mpje-expansion-batch2-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify repair base and locked gates
        shell: bash
        run: |
          set -euo pipefail
          BASE=34b3a6534084c123cc91b7671e25468ef4a4a45c
          git diff --quiet "$BASE" HEAD -- data/questions data/rules data/drugs data/exam_style data/release_requirements.json site/generated
          test "$(git rev-parse "$BASE")" = "$BASE"
          test "$(git rev-parse d7cc340a87781f261071325b7366d118cbd7bd84)" = d7cc340a87781f261071325b7366d118cbd7bd84
      - name: Apply Issue 37 adjudicated repairs only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from qa_common import semantic_content_hash

          def load(path): return json.loads(Path(path).read_text())
          def save(path,obj): Path(path).write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          def choice(q,cid,text):
              for c in q['choices']:
                  if c['id']==cid:
                      c['text']=text; return
              raise KeyError(cid)

          # Q0147 — routine administration-record transmission is strongly encouraged, not categorically required.
          p='data/questions/ma-q-0147.json'; q=load(p)
          assert q['question_id']=='MA-Q-0147' and q['correct_choice_ids']==['A','D','E']
          choice(q,'A','Send the administration record to the prescriber as soon after administration as practical, as strongly encouraged by the DCP guidance')
          q['explanation']['core_reasoning']='Eligible MH/SUD administration remains patient-specific and documented; routine prescriber communication is strongly encouraged, and ordinary privacy obligations remain in force.'
          q['explanation']['choice_analysis']['A']='DCP guidance strongly encourages pharmacists and pharmacy interns to send administration records to prescribers as soon after administration as practical.'
          q['reasoning_steps']=['Confirm eligible MH/SUD administration','Apply dose, recordkeeping, communication-guidance, and privacy requirements']
          save(p,q)

          # Q0165 — current 21 CFR 1306.07(b) permits up to a 3-day supply at one time and bars renewal/extension.
          p='data/questions/ma-q-0165.json'; q=load(p)
          assert q['question_id']=='MA-Q-0165' and q['correct_choice_ids']==['A','B','C','D']
          choice(q,'B','Not more than a three-day supply may be dispensed at one time while referral arrangements are being made')
          choice(q,'C','The emergency treatment under this provision may not be renewed or extended')
          q['explanation']['core_reasoning']='The narrow non-OTP emergency provision allows practitioner dispensing, rather than prescribing, of not more than a three-day supply at one time while referral is arranged; the emergency treatment may not be renewed or extended.'
          q['explanation']['choice_analysis']['B']='Current 21 CFR 1306.07(b) permits not more than a three-day supply to be dispensed at one time while referral arrangements are being made.'
          q['explanation']['choice_analysis']['C']='The regulation states that this emergency treatment may not be renewed or extended.'
          q['reasoning_steps']=['Identify non-OTP emergency OUD treatment','Separate dispensing from prescribing','Apply the three-day-at-one-time ceiling and no-renewal/no-extension rule']
          save(p,q)

          # Q0175 — same MA communication correction.
          p='data/questions/ma-q-0175.json'; q=load(p)
          assert q['question_id']=='MA-Q-0175' and q['correct_choice_ids']==['A','B','C','D']
          choice(q,'B','Send the administration record to the prescriber as soon after administration as practical, as strongly encouraged by the DCP guidance')
          q['explanation']['core_reasoning']='Pharmacy administration of an eligible LAI remains patient-specific and documented; routine transmission of the administration record to the prescriber is strongly encouraged, and privacy duties continue to apply.'
          q['explanation']['choice_analysis']['B']='DCP guidance strongly encourages sending administration records to the prescriber as soon after administration as practical.'
          q['reasoning_steps']=['Confirm eligible patient-specific LAI administration','Apply recordkeeping, communication guidance, and privacy requirements']
          save(p,q)

          # Q0195 — preserve dispense-not-prescribe distinction but remove obsolete daily dispensing language.
          p='data/questions/ma-q-0195.json'; q=load(p)
          assert q['question_id']=='MA-Q-0195' and q['correct_choice_ids']==['B']
          choice(q,'B','No. Under the emergency provision, the practitioner may dispense, but not prescribe, up to a three-day supply at one time while arranging referral; the treatment may not be renewed or extended.')
          q['explanation']['core_reasoning']='The federal three-day rule is a narrow practitioner-dispensing bridge, not authority for a routine three-day methadone retail prescription; current law permits up to a three-day supply to be dispensed at one time while referral is arranged and bars renewal or extension of the emergency treatment.'
          q['explanation']['choice_analysis']['B']='The practitioner, rather than a retail pharmacy acting on a routine prescription, may use the narrow dispensing exception for up to a three-day supply at one time while arranging referral; the emergency treatment may not be renewed or extended.'
          q['explanation']['related_facts']=['The emergency provision authorizes dispensing, not a routine methadone prescription, while referral for treatment is arranged.']
          q['reasoning_steps']=['Identify the non-OTP emergency provision','Separate practitioner dispensing from retail prescribing','Apply the current three-day-at-one-time and no-renewal/no-extension limits']
          save(p,q)

          # Shared MA rule — make communication distinction explicit and point directly to DCP 19-2-105.
          p='data/rules/ma-mh-sud-admin.json'; r=load(p)
          assert r['rule_id']=='MA-MH-SUD-ADMIN' and r['content_version']==1
          r['content_version']=2
          r['rule_summary']='Massachusetts guidance permits appropriately trained pharmacists and pharmacy interns to administer listed patient-specific prescribed single-dose long-acting mental-health medications and extended-release naltrexone under specified conditions. Required safeguards include patient-specific prescribing, training/CPR, counseling, recordkeeping and privacy. Routine pharmacist-prescriber communication and sending administration records as soon as practical are strongly encouraged; adverse events should be communicated within 24 hours, and specified serious outcomes must be reported to the prescriber immediately.'
          r['authority']=[{'type':'OFFICIAL_GUIDANCE','name':'Massachusetts Drug Control Program — Circular DCP 19-2-105','section':'Dispensing by Administration; Record Keeping; Reporting Adverse Events; Pharmacist-Prescriber Communication; Privacy','url':'https://www.mass.gov/news/circular-dcp-19-2-105-pharmacist-administration-of-medications-for-the-treatment-of-mental-illness-and-substance-use-disorder'}]
          r['common_confusions']=['Routine administration-record transmission to the prescriber is strongly encouraged rather than a categorical prerequisite to every administration; specified serious adverse events have an immediate reporting requirement.']
          r['verification_notes']='Repaired after independent Batch 2 audit PR #36 / adjudication Issue #37 to distinguish strongly encouraged routine communication from adverse-event reporting duties. Requires fresh independent re-audit before release.'
          r['content_hash']=semantic_content_hash(r,'rule')
          save(p,r)

          # Shared federal rule — current post-amendment 3-day-at-one-time text.
          p='data/rules/fed-oud-otp.json'; r=load(p)
          assert r['rule_id']=='FED-OUD-OTP' and r['content_version']==1
          r['content_version']=2
          r['rule_summary']='Federal law distinguishes ordinary controlled-prescription practice from narcotic maintenance/detoxification treatment. Methadone OUD maintenance generally follows the narcotic-treatment-program framework. Under the narrow non-OTP emergency provision in 21 CFR 1306.07(b), a practitioner may dispense, but not prescribe, not more than a three-day supply of narcotic medication at one time while arrangements for referral are made; that emergency treatment may not be renewed or extended. Qualifying Schedule III-V narcotic treatment may use a prescription pathway when otherwise lawful.'
          r['authority']=[
            {'type':'FEDERAL_REGULATION','name':'Electronic Code of Federal Regulations','section':'21 CFR 1306.07','url':'https://www.ecfr.gov/current/title-21/chapter-II/part-1306/section-1306.07'},
            {'type':'DEA_OFFICIAL','name':'DEA Diversion Control Division','section':'Instructions to request exception to 21 CFR 1306.07(b) 3-day rule','url':'https://www.deadiversion.usdoj.gov/drugreg/registration.html'}
          ]
          r['common_confusions']=['The current emergency limit is up to a three-day supply dispensed at one time; the former one-day-at-a-time language is obsolete. The pathway authorizes dispensing, not a routine retail prescription, and may not be renewed or extended.']
          r['verification_notes']='Repaired after independent Batch 2 audit PR #36 / adjudication Issue #37 to reflect the current 21 CFR 1306.07(b) three-day-supply-at-one-time rule. Requires fresh independent re-audit before release.'
          r['content_hash']=semantic_content_hash(r,'rule')
          save(p,r)

          # Locked lifecycle / verification state remains pending on all four repaired questions.
          for n in (147,165,175,195):
              q=load(f'data/questions/ma-q-{n:04d}.json')
              assert q['lifecycle_status']=='AUDIT_PENDING'
              assert q['verification_status']=='AUDIT_PENDING'
              assert q['development_fixture'] is True
              assert q['independent_audit_status']=='PENDING'
          print('applied 4 question repairs + 2 shared rule repairs')
          PY
      - name: Regenerate derived artifacts and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_artifacts.py --write
          python scripts/validate_all.py
          python -m pytest -q
          # Locked release/preview/Batch3 guardrails.
          git diff --quiet 34b3a6534084c123cc91b7671e25468ef4a4a45c -- data/release_requirements.json
          git diff --quiet 34b3a6534084c123cc91b7671e25468ef4a4a45c -- data/exam_style
          python - <<'PY'
          import json
          from pathlib import Path
          changed={147,165,175,195}
          for p in Path('data/questions').glob('ma-q-*.json'):
              n=int(p.stem[-4:])
              q=json.loads(p.read_text())
              if 131<=n<=210:
                  assert q['lifecycle_status']=='AUDIT_PENDING'
                  assert q['verification_status']=='AUDIT_PENDING'
                  assert q['development_fixture'] is True
          print('Batch 2 lifecycle gates remain locked')
          PY
      - name: Record repair manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from qa_common import question_audit_hash
          changed=['MA-Q-0147','MA-Q-0165','MA-Q-0175','MA-Q-0195']
          impact=['MA-Q-0145','MA-Q-0146','MA-Q-0147','MA-Q-0164','MA-Q-0165','MA-Q-0166','MA-Q-0171','MA-Q-0172','MA-Q-0173','MA-Q-0175','MA-Q-0193','MA-Q-0194','MA-Q-0195','MA-Q-0196']
          hashes={}
          for qid in impact:
              n=int(qid[-4:]); q=json.loads(Path(f'data/questions/ma-q-{n:04d}.json').read_text())
              hashes[qid]=question_audit_hash(q)
          rules={}
          for rid,path in [('MA-MH-SUD-ADMIN','data/rules/ma-mh-sud-admin.json'),('FED-OUD-OTP','data/rules/fed-oud-otp.json')]:
              r=json.loads(Path(path).read_text()); rules[rid]={'content_version':r['content_version'],'content_hash':r['content_hash']}
          manifest={'adjudication_issue':37,'source_audit_pr':36,'frozen_author_candidate_sha':'d7cc340a87781f261071325b7366d118cbd7bd84','initial_freeze_sha':'34b3a6534084c123cc91b7671e25468ef4a4a45c','changed_question_ids':changed,'shared_rule_repairs':rules,'fresh_reaudit_impact_set':impact,'impact_question_hashes':hashes,'release_gate':'BLOCKED_PENDING_FRESH_REAUDIT','batch3_gate':'BLOCKED'}
          p=Path('audits/repair/2026-08-15/BATCH2-REPAIR-V1-MANIFEST.json'); p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'batch2-repair-bot'
          git config user.email 'batch2-repair-bot@users.noreply.github.com'
          git rm .github/workflows/batch2-repair-v1.yml
          git add data/questions data/rules site/generated answer_distribution_report.json duplicate_report.json structural_pattern_report.json audits/repair/2026-08-15/BATCH2-REPAIR-V1-MANIFEST.json
          git diff --cached --name-only
          git commit -m 'repair(batch2): correct four audited items and shared rules'
          git push origin HEAD:repair/mpje-expansion-batch2-v1
