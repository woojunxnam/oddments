name: Diagnose Full Pre-Batch3 T1 Gate

on:
  push:
    branches:
      - release/pre-batch3-legacy-salvage-t1-r1
    paths:
      - .github/workflows/diagnose-prebatch3-t1-full.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/pre-batch3-legacy-salvage-t1-r1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Execute full gate diagnostically
        shell: bash
        run: |
          set +e
          LOG=/tmp/t1-full-diagnostic.md
          : > "$LOG"
          echo '# Pre-Batch3 T1 full-gate diagnostic' >> "$LOG"
          echo >> "$LOG"
          echo "HEAD: $(git rev-parse HEAD)" >> "$LOG"
          echo >> "$LOG"
          overall=0
          run_step() {
            name="$1"; shift
            echo "## $name" >> "$LOG"
            echo '```' >> "$LOG"
            "$@" >> "$LOG" 2>&1
            code=$?
            echo '```' >> "$LOG"
            echo "exit_code: $code" >> "$LOG"
            echo >> "$LOG"
            if [ "$code" -ne 0 ]; then overall="$code"; return "$code"; fi
            return 0
          }
          run_step preflight python scripts/admit_prebatch3_t1.py --check || true
          if [ "$overall" -eq 0 ]; then run_step apply python scripts/admit_prebatch3_t1.py --apply || true; fi
          if [ "$overall" -eq 0 ]; then run_step generate python scripts/generate_artifacts.py --write || true; fi
          if [ "$overall" -eq 0 ]; then run_step post_verify python scripts/admit_prebatch3_t1.py --verify-post || true; fi
          if [ "$overall" -eq 0 ]; then run_step validate python scripts/validate_all.py || true; fi
          if [ "$overall" -eq 0 ]; then run_step pytest python -m pytest -q || true; fi
          echo "overall_exit_code: $overall" >> "$LOG"
          git reset --hard HEAD
          mkdir -p audits/remediation/2026-08-17
          cp "$LOG" audits/remediation/2026-08-17/PRE-BATCH3-T1-FULL-GATE-DIAGNOSTIC.md
          cat audits/remediation/2026-08-17/PRE-BATCH3-T1-FULL-GATE-DIAGNOSTIC.md
          exit 0

      - name: Commit diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/remediation/2026-08-17/PRE-BATCH3-T1-FULL-GATE-DIAGNOSTIC.md
          git commit -m "ci: record full T1 release-gate diagnostic"
          git push origin HEAD:release/pre-batch3-legacy-salvage-t1-r1
