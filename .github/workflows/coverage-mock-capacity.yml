name: MPJE Blueprint Mock Capacity
on:
  push:
    branches: [analysis/mpje-coverage-debt-prep]
    paths: ['.github/workflows/coverage-mock-capacity.yml']
permissions:
  contents: write
jobs:
  capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/mpje-coverage-debt-prep
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          bp=json.loads(Path('data/blueprint.json').read_text())
          qs=[json.loads(p.read_text()) for p in sorted(Path('data/questions').glob('ma-q-*.json'))]
          counts=Counter(q['area'] for q in qs)
          usable=Counter(q['area'] for q in qs if q['lifecycle_status']=='RELEASED' and q['verification_status']=='RELEASED' and q.get('independent_audit_status')=='PASSED' and q.get('final_adjudication',{}).get('decision')=='KEEP')
          n=bp['target_question_count_per_mock']
          raw={x['area']:n*x['weight_percent']/100 for x in bp['areas']}
          # Largest-remainder allocation to exactly n questions.
          alloc={a:int(v) for a,v in raw.items()}
          remaining=n-sum(alloc.values())
          for a,_ in sorted(raw.items(),key=lambda kv:(-(kv[1]-int(kv[1])),kv[0]))[:remaining]: alloc[a]+=1
          assert sum(alloc.values())==n
          scenarios={}
          for mocks in (1,2,3):
              needed={a:alloc[a]*mocks for a in alloc}
              scenarios[str(mocks)]={
                  'required_by_area':needed,
                  'canonical_deficit_by_area':{a:max(0,needed[a]-counts[a]) for a in needed},
                  'release_usable_deficit_by_area':{a:max(0,needed[a]-usable[a]) for a in needed},
                  'canonical_can_build_without_reuse':all(counts[a]>=needed[a] for a in needed),
                  'release_usable_can_build_without_reuse':all(usable[a]>=needed[a] for a in needed),
              }
          out={'source_sha':'1c85163367a82c06061f3d5be3f7d05c3748bca2','target_questions_per_mock':n,'raw_weighted_counts':raw,'integer_blueprint_allocation':alloc,'canonical_counts_by_area':dict(counts),'release_usable_counts_by_area':dict(usable),'scenarios':scenarios,'interpretation':'Capacity only. A pool can have more questions than blueprint weight in one area; gate asks whether it has enough unique questions in every area to assemble one or more blueprint-faithful mocks without reuse.'}
          p=Path('audits/coverage/2026-08-17/PRE-BATCH3-MOCK-CAPACITY.json'); p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - shell: bash
        run: |
          git config user.name coverage-capacity-bot
          git config user.email coverage-capacity-bot@users.noreply.github.com
          git rm .github/workflows/coverage-mock-capacity.yml
          git add audits/coverage/2026-08-17/PRE-BATCH3-MOCK-CAPACITY.json
          git commit -m 'analysis(mpje): add blueprint mock capacity analysis'
          git push origin HEAD:analysis/mpje-coverage-debt-prep
