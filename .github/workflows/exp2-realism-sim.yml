name: EXP2 Full Bank Similarity Triage
on:
  push:
    branches: [audit/gpt-fresh-exp2-a-q0131-0210]
    paths: ['.github/workflows/exp2-realism-sim.yml']
permissions:
  contents: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/gpt-fresh-exp2-a-q0131-0210
      - shell: bash
        run: |
          python - <<'PY'
          import json,re
          from difflib import SequenceMatcher
          from pathlib import Path
          def norm(s): return re.sub(r'\s+',' ',re.sub(r'[^a-z0-9 ]',' ',s.lower())).strip()
          qs=[]
          for p in sorted(Path('data/questions').glob('ma-q-*.json')):
            q=json.loads(p.read_text())
            text=q['stem']+' '+' '.join(c['text'] for c in q['choices'])
            qs.append((q['question_id'],q.get('family_id'),q.get('topic'),norm(text)))
          rows=[]
          for qid,fam,topic,text in qs:
            n=int(qid[-4:])
            if not (131<=n<=210): continue
            best=[]
            for oid,ofam,otopic,otext in qs:
              if oid==qid: continue
              score=SequenceMatcher(None,text,otext).ratio()
              best.append((score,oid,ofam,otopic))
            best=sorted(best,reverse=True)[:5]
            rows.append({'question_id':qid,'family_id':fam,'top_matches':[{'score':round(s,4),'question_id':o,'family_id':f,'topic':t} for s,o,f,t in best]})
          high=[]
          for r in rows:
            for m in r['top_matches']:
              if m['score']>=0.72:
                high.append({'question_id':r['question_id'],**m})
          out={'method':'SequenceMatcher over normalized stem+choices; triage only, followed by human review','batch_question_count':80,'high_similarity_threshold':0.72,'high_similarity_pairs':high,'all_top_matches':rows}
          Path('audits/work/2026-08-15/EXP2-GPT-A-FULL-BANK-SIMILARITY.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('high similarity pairs',len(high))
          for x in high: print(x)
          PY
      - shell: bash
        run: |
          git config user.name exp2-realism-bot
          git config user.email exp2-realism-bot@users.noreply.github.com
          git rm .github/workflows/exp2-realism-sim.yml
          git add audits/work/2026-08-15/EXP2-GPT-A-FULL-BANK-SIMILARITY.json
          git commit -m 'audit(exp2): record full-bank similarity triage'
          git push origin HEAD:audit/gpt-fresh-exp2-a-q0131-0210
