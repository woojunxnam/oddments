name: Freeze Pre-Batch3 Legacy Salvage T1

on:
  push:
    branches:
      - freeze/pre-batch3-legacy-salvage-t1

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out freeze branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify freeze starting boundary
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=c99161a7f3e50bb95491de98f895795989d22a16
          git merge-base --is-ancestor "$CANDIDATE" HEAD
          python - <<'PY'
          import subprocess
          candidate = "c99161a7f3e50bb95491de98f895795989d22a16"
          changed = set(subprocess.check_output(["git", "diff", "--name-only", f"{candidate}..HEAD"], text=True).splitlines())
          expected = {
              "scripts/freeze_legacy_salvage_t1.py",
              ".github/workflows/freeze-pre-batch3-legacy-salvage-t1.yml",
          }
          if changed != expected:
              raise SystemExit(f"unexpected pre-freeze drift: {sorted(changed)}")
          print("freeze starting boundary: PASS")
          PY

      - name: Generate frozen audit packages
        run: python scripts/freeze_legacy_salvage_t1.py

      - name: Enforce freeze write boundary
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          lines = subprocess.check_output(["git", "status", "--porcelain=v1", "--untracked-files=all"], text=True).splitlines()
          paths = {line[3:].split(" -> ")[-1] for line in lines}
          expected = {
              "audits/remediation/2026-08-17/GPT-A-LEGAL-PRE-BATCH3-LEGACY-SALVAGE-T1.json",
              "audits/remediation/2026-08-17/GPT-A-REALISM-PRE-BATCH3-LEGACY-SALVAGE-T1.json",
              "audits/remediation/2026-08-17/PRE-BATCH3-LEGACY-SALVAGE-T1-FREEZE-MANIFEST.json",
          }
          if paths != expected:
              raise SystemExit(f"unexpected freeze writes: {sorted(paths)}")
          print("freeze write boundary: PASS")
          PY

      - name: Validate frozen package invariants
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("audits/remediation/2026-08-17")
          manifest = json.loads((root / "PRE-BATCH3-LEGACY-SALVAGE-T1-FREEZE-MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["candidate_sha"] == "c99161a7f3e50bb95491de98f895795989d22a16"
          assert manifest["question_count"] == 30
          assert len(manifest["question_ids"]) == 30
          assert len(manifest["question_hashes"]) == 30
          assert set(manifest["question_ids"]) == set(manifest["question_hashes"])
          for path_text, meta in manifest["packages"].items():
              data = Path(path_text).read_bytes()
              assert hashlib.sha256(data).hexdigest() == meta["sha256"], path_text
              package = json.loads(data)
              assert package["candidate_sha"] == manifest["candidate_sha"]
              assert package["auditor_instance"] == manifest["auditor_instance_reserved"]
              assert package["audit_scope"] == "INITIAL_BATCH"
              assert package["question_ids"] == manifest["question_ids"]
              assert package["question_hashes"] == manifest["question_hashes"]
          print("frozen package invariants: PASS")
          PY

      - name: Validate repository
        run: python scripts/validate_all.py

      - name: Run full tests
        run: python -m pytest -q

      - name: Prove generated-artifact freshness
        run: python scripts/generate_artifacts.py --write && git diff --exit-code -- answer_distribution_report.json structural_pattern_report.json generated site/generated/questions.json

      - name: Commit frozen audit inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/remediation/2026-08-17/GPT-A-LEGAL-PRE-BATCH3-LEGACY-SALVAGE-T1.json
          git add audits/remediation/2026-08-17/GPT-A-REALISM-PRE-BATCH3-LEGACY-SALVAGE-T1.json
          git add audits/remediation/2026-08-17/PRE-BATCH3-LEGACY-SALVAGE-T1-FREEZE-MANIFEST.json
          git commit -m "freeze: lock Tranche 1 fresh-audit inputs"

      - name: Push frozen inputs
        run: git push origin HEAD:freeze/pre-batch3-legacy-salvage-t1
