name: Chapter 30 two-full-length-mock QA
on:
  pull_request:
    paths:
      - 'site/mpje-side-notes/exam-simulation-30/**'
      - 'scripts/verify_ch30_mock120_browser.py'
      - 'scripts/verify_ch30_form_c_browser.py'
      - '.github/workflows/ch30-mock120-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-mock-120:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source bank topic inventory
        run: python scripts/update_ch30_topic_inventory.py --check
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Validate both exam scripts
        run: |
          node --check site/mpje-side-notes/exam-simulation-30/mock-120.js
          node --check site/mpje-side-notes/exam-simulation-30/mock-120-c.js
      - name: Exercise A/B and C in real desktop/mobile browsers
        run: |
          python -m http.server 8173 --bind 127.0.0.1 --directory site > /tmp/ch30-mock-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python scripts/verify_ch30_mock120_browser.py --base-url http://127.0.0.1:8173/
          python scripts/verify_ch30_form_c_browser.py --base-url http://127.0.0.1:8173/
