name: Build Round 2 freeze packages

on:
  push:
    branches:
      - freeze/mpje-expansion-batch2-realism-r2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out freeze branch
        uses: actions/checkout@v4
        with:
          ref: freeze/mpje-expansion-batch2-realism-r2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exact frozen audit inputs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / "scripts"))
          from qa_common import question_audit_hash

          candidate_sha = "f85b650c1b3344184186229ec45bf1d233a4e971"
          prior_frozen_sha = "a1b4c914c6556470fab4a71f070f48dc37440e6f"
          prior_candidate_sha = "1c85163367a82c06061f3d5be3f7d05c3748bca2"
          auditor_instance = "GPT-FRESH-EXP2-C"
          outdir = ROOT / "audits" / "reaudit" / "2026-08-17"
          outdir.mkdir(parents=True, exist_ok=True)

          changed = ["MA-Q-0164", "MA-Q-0172", "MA-Q-0173", "MA-Q-0175", "MA-Q-0195"]
          counterparts = ["MA-Q-0147", "MA-Q-0165", "MA-Q-0193", "MA-Q-0194"]
          question_ids = ["MA-Q-0147", "MA-Q-0164", "MA-Q-0165", "MA-Q-0172", "MA-Q-0173", "MA-Q-0175", "MA-Q-0193", "MA-Q-0194", "MA-Q-0195"]

          previous_hashes = {
              "MA-Q-0147": "aa85629829448bde8e01b028f60439ad824169ac1b9de2bee798f4a68ab58a10",
              "MA-Q-0164": "b5922b8edbb9a5370a5af5874d06f67b9fd3ba82b97ba23e4a046f44926068f5",
              "MA-Q-0165": "9f259f7c9942d6b53b32e678596515c3c76df07f1159de009ea7002b07fc1b45",
              "MA-Q-0172": "f9678bc85fbebb8562f2148f19ce84b396ce236a32cc674d2dd336b92ea5d3fb",
              "MA-Q-0173": "633fe60669fcd42a8524608163bb24f9df7ca95b9ece63d67aa78f49e3566e09",
              "MA-Q-0175": "2e9b5cf4f107f54631b65519272b2e4e017bcfeb44acfa35c9a87691f31e8489",
              "MA-Q-0193": "41a3734a5932214072b3c01d98dbdf9ecf8746aa679d6f10bf1d170fc799fe18",
              "MA-Q-0194": "4e84e01beeab308ec89754da7539f384054439b50a45a84dc85281bd97314488",
              "MA-Q-0195": "cefe38dc2fb02cbbca986ff66fcd3f53d159878c1ca22f483226303173200ca8",
          }

          def load_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          questions = []
          qhashes = {}
          for qid in question_ids:
              q = load_json(ROOT / "data" / "questions" / f"{qid.lower()}.json")
              questions.append(q)
              qhashes[qid] = question_audit_hash(q)

          for qid in changed:
              assert qhashes[qid] != previous_hashes[qid], f"expected changed hash for {qid}"
          for qid in counterparts:
              assert qhashes[qid] == previous_hashes[qid], f"unexpected counterpart hash drift for {qid}"

          rules = {}
          for rid in ["FED-OUD-OTP", "FED-CORRESPONDING-RESP", "MA-MH-SUD-ADMIN"]:
              r = load_json(ROOT / "data" / "rules" / f"{rid.lower()}.json")
              rules[rid] = {"content_version": r["content_version"], "content_hash": r["content_hash"]}

          style = load_json(ROOT / "data" / "exam_style" / "mpje_style_profile.json")
          style_snapshot = {
              "profile_id": style["profile_id"],
              "content_version": style["content_version"],
              "content_hash": style["content_hash"],
          }

          common = {
              "audit_date": "2026-08-17",
              "audit_scope": "REAUDIT",
              "audit_status": "STRUCTURAL_TRIAGE_ONLY",
              "auditor": "GPT",
              "auditor_instance": auditor_instance,
              "independent": True,
              "question_hashes": qhashes,
              "question_ids": question_ids,
              "questions": questions,
          }

          legal = dict(common)
          legal.update({
              "audit_id": "AUDIT-GPT-FRESH-EXP2-C-LEGAL-REAUDIT-R2-IMPACT9-2026-08-17",
              "result_contract": {
                  "required_fields": ["Question_ID", "Verdict", "Severity", "Existing_Answer_Correct", "authorities", "Problem", "Proposed_Answer", "Proposed_Rewrite", "Proposed_Explanation"],
                  "warning": "STRUCTURAL_TRIAGE_ONLY cannot satisfy release. Fresh auditor must independently solve and verify current official law; do not modify canonical questions."
              },
              "review_type": "LEGAL_VERIFICATION",
          })

          realism = dict(common)
          realism.update({
              "audit_id": "AUDIT-GPT-FRESH-EXP2-C-REALISM-REAUDIT-R2-IMPACT9-2026-08-17",
              "result_contract": {
                  "required_fields": ["Question_ID", "Verdict", "Severity", "Realism_Verdict", "Reviewed_Date", "Criteria", "Notes"],
                  "warning": "STRUCTURAL_TRIAGE_ONLY cannot satisfy release. Fresh auditor must compare against the full canonical bank, including the specified semantic counterparts, and must not modify canonical questions."
              },
              "review_type": "REALISM_REVIEW",
              "style_profile": style_snapshot,
          })

          legal_name = "GPT-C-LEGAL-EXP2-R2-REAUDIT-IMPACT9.json"
          realism_name = "GPT-C-REALISM-EXP2-R2-REAUDIT-IMPACT9.json"

          def write_json(path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          write_json(outdir / legal_name, legal)
          write_json(outdir / realism_name, realism)

          package_hashes = {
              legal_name: hashlib.sha256((outdir / legal_name).read_bytes()).hexdigest(),
              realism_name: hashlib.sha256((outdir / realism_name).read_bytes()).hexdigest(),
          }

          manifest = {
              "batch": "EXP2",
              "repair_round": "REALISM_R2",
              "fresh_auditor_instance_reserved": auditor_instance,
              "gates": {
                  "batch3": "BLOCKED",
                  "merge": "BLOCKED",
                  "public_preview": "BLOCKED",
                  "release": "BLOCKED_PENDING_FRESH_REAUDIT"
              },
              "prior_reaudit_frozen_head": prior_frozen_sha,
              "prior_repaired_candidate_sha": prior_candidate_sha,
              "repaired_candidate_sha": candidate_sha,
              "question_hash_changes_from_prior_reaudit": changed,
              "question_hash_unchanged_semantic_counterparts": counterparts,
              "question_ids": question_ids,
              "previous_question_hashes": previous_hashes,
              "question_hashes": qhashes,
              "shared_rule_dependencies": rules,
              "style_profile": style_snapshot,
              "packages": package_hashes,
              "qa": {
                  "workflow_run": 32036799489,
                  "validate_all": "PASS_0_ERRORS_1_PREEXISTING_WARNING_Q0190",
                  "pytest": "PASS_80",
                  "generated_artifact_freshness": "PASS"
              }
          }
          write_json(outdir / "BATCH2-REALISM-R2-REFREEZE-MANIFEST.json", manifest)

          print(json.dumps({"question_hashes": qhashes, "packages": package_hashes}, indent=2))
          PY

      - name: Commit frozen packages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/reaudit/2026-08-17/BATCH2-REALISM-R2-REFREEZE-MANIFEST.json \
                  audits/reaudit/2026-08-17/GPT-C-LEGAL-EXP2-R2-REAUDIT-IMPACT9.json \
                  audits/reaudit/2026-08-17/GPT-C-REALISM-EXP2-R2-REAUDIT-IMPACT9.json
          if git diff --cached --quiet; then
            echo "Freeze packages already current."
            exit 0
          fi
          git commit -m "freeze: add Batch 2 realism Round 2 audit packages"
          git push origin HEAD:freeze/mpje-expansion-batch2-realism-r2
