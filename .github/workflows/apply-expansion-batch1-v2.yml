name: Apply Expansion Batch 1 v2 Repair

on:
  push:
    branches:
      - repair/mpje-expansion-batch1-v2
    paths:
      - .github/workflows/apply-expansion-batch1-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/mpje-expansion-batch1-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Apply deterministic repair
        run: python scripts/apply_expansion_batch1_v2.py

      - name: Refresh semantic hashes and generated artifacts
        run: |
          python scripts/update_content_hashes.py
          python scripts/generate_artifacts.py --write

      - name: Export fresh current-hash re-audit packages
        run: |
          mkdir -p audits/reaudit/2026-08-14
          python scripts/export_audit_batch.py --auditor GPT --auditor-instance GPT-FRESH-EXP1-V2-A --audit-id AUDIT-GPT-EXP1-V2-A-LEGAL-REAUDIT-2026-08-14 --review-type LEGAL_VERIFICATION --audit-scope REAUDIT --start 90 --count 39 --output audits/reaudit/2026-08-14/GPT-A-LEGAL-EXP1-V2-Q0091-0129.json
          python scripts/export_audit_batch.py --auditor GPT --auditor-instance GPT-FRESH-EXP1-V2-A --audit-id AUDIT-GPT-EXP1-V2-A-REALISM-REAUDIT-2026-08-14 --review-type REALISM_REVIEW --audit-scope REAUDIT --start 90 --count 39 --output audits/reaudit/2026-08-14/GPT-A-REALISM-EXP1-V2-Q0091-0129.json
          python scripts/export_audit_batch.py --auditor GPT --auditor-instance GPT-FRESH-EXP1-V2-B --audit-id AUDIT-GPT-EXP1-V2-B-LEGAL-REAUDIT-2026-08-14 --review-type LEGAL_VERIFICATION --audit-scope REAUDIT --start 90 --count 39 --output audits/reaudit/2026-08-14/GPT-B-LEGAL-EXP1-V2-Q0091-0129.json

      - name: Validate full repository
        run: python scripts/validate_all.py

      - name: Run tests
        run: python -m pytest -q

      - name: Remove one-shot workflow and commit repair
        run: |
          rm .github/workflows/apply-expansion-batch1-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repair: rebuild MPJE Expansion Batch 1 v2"

      - name: Prove generated artifacts are current after commit
        run: |
          python scripts/generate_artifacts.py --write
          git diff --exit-code
          python scripts/validate_all.py
          python -m pytest -q

      - name: Push repaired branch
        run: git push origin HEAD:repair/mpje-expansion-batch1-v2
