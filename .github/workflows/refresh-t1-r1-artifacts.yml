name: Refresh T1 R1 Generated Artifacts

on:
  push:
    branches:
      - repair/pre-batch3-legacy-salvage-t1-r1
    paths:
      - .github/workflows/refresh-t1-r1-artifacts.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify repair boundary before generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          base = 'c99161a7f3e50bb95491de98f895795989d22a16'
          changed = set(subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD'], text=True).splitlines())
          expected = {
              'data/questions/ma-q-0028.json',
              'data/questions/ma-q-0032.json',
              'data/questions/ma-q-0036.json',
              '.github/workflows/refresh-t1-r1-artifacts.yml',
          }
          if changed != expected:
              raise SystemExit(f'unexpected pre-generation drift: {sorted(changed)}')
          print('pre-generation repair boundary: PASS')
          PY

      - name: Synchronize question family registry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/exam_style/question_family_matrix.json')
          matrix = json.loads(path.read_text(encoding='utf-8'))
          families = matrix['families']
          by_id = {family['family_id']: family for family in families}

          for old_id in (
              'P2_0028_FED_CIII_V_REFILL',
              'P2_0032_FED_CIII_V_REFILL',
              'P2_0036_FED_EPCS_TRANSFER',
          ):
              if old_id not in by_id:
                  raise SystemExit(f'expected old family missing: {old_id}')
              by_id[old_id]['current_candidate_count'] = 0

          replacements = [
              {
                  'family_id': 'P2_0028_FED_CIII_V_PARTIAL',
                  'area': 3,
                  'topic': 'Controlled prescriptions',
                  'subtopic': 'Schedule III-V partial fills',
                  'primary_rule_ids': ['FED-CIII-V-PARTIAL'],
                  'secondary_rule_ids': ['FED-CS-SCHEDULES'],
                  'drug_required': True,
                  'scenario_types': ['partial fill'],
                  'common_traps': ['treating a partial fill as an additional refill or restarting the six-month clock'],
                  'target_difficulties': [4],
                  'target_item_types': ['SBA'],
                  'max_questions_in_final_bank': 2,
                  'current_candidate_count': 1,
                  'current_released_count': 0,
              },
              {
                  'family_id': 'P2_0032_FED_CIII_IV_ORAL_REFILL_AUTH',
                  'area': 3,
                  'topic': 'Controlled prescriptions',
                  'subtopic': 'Schedule III-IV refill authorization',
                  'primary_rule_ids': ['FED-CIII-V-REFILL'],
                  'secondary_rule_ids': ['FED-CS-SCHEDULES'],
                  'drug_required': True,
                  'scenario_types': ['oral refill authorization'],
                  'common_traps': ['requiring a new prescription for every added refill authorization or restarting the six-month clock'],
                  'target_difficulties': [3, 4],
                  'target_item_types': ['SBA'],
                  'max_questions_in_final_bank': 2,
                  'current_candidate_count': 1,
                  'current_released_count': 0,
              },
              {
                  'family_id': 'P2_0036_FED_EPCS_TRANSFER_REFILLS',
                  'area': 3,
                  'topic': 'Prescription transfer',
                  'subtopic': 'Electronic prescription transfer consequences',
                  'primary_rule_ids': ['FED-EPCS-TRANSFER'],
                  'secondary_rule_ids': ['FED-CS-SCHEDULES'],
                  'drug_required': True,
                  'scenario_types': ['electronic prescription transfer'],
                  'common_traps': ['splitting authorized refills from the transferred original prescription'],
                  'target_difficulties': [4],
                  'target_item_types': ['SBA'],
                  'max_questions_in_final_bank': 2,
                  'current_candidate_count': 1,
                  'current_released_count': 0,
              },
          ]
          for replacement in replacements:
              if replacement['family_id'] in by_id:
                  raise SystemExit(f'replacement family unexpectedly exists: {replacement["family_id"]}')
              families.append(replacement)

          matrix['last_reviewed'] = '2026-08-17'
          path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('question family registry synchronized')
          PY

      - name: Regenerate deterministic artifacts
        run: python scripts/generate_artifacts.py --write

      - name: Validate repository and capture diagnostics
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_all.py 2>&1 | tee /tmp/t1-r1-validate.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-r1-validation-diagnostics
          path: /tmp/t1-r1-validate.log
          if-no-files-found: error

      - name: Enforce validation result
        if: steps.validate.outcome != 'success'
        run: exit 1

      - name: Run full tests
        run: python -m pytest -q

      - name: Enforce generated write boundary
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          lines = subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'], text=True).splitlines()
          paths = {line[3:].split(' -> ')[-1] for line in lines}
          allowed = {
              'data/exam_style/question_family_matrix.json',
              'duplicate_report.json',
              'answer_distribution_report.json',
              'structural_pattern_report.json',
              'site/generated/questions.json',
          }
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit(f'unexpected generated writes: {unexpected}')
          print(f'generated write boundary: PASS ({len(paths)} paths)')
          PY

      - name: Commit refreshed governance/artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/exam_style/question_family_matrix.json duplicate_report.json answer_distribution_report.json structural_pattern_report.json site/generated/questions.json
          if git diff --cached --quiet; then
            echo 'no governance/generated changes'
          else
            git commit -m 'generated: sync T1 r1 family registry and artifacts'
            git push origin HEAD:repair/pre-batch3-legacy-salvage-t1-r1
          fi

      - name: Prove exact-head artifact freshness
        run: python scripts/generate_artifacts.py --write && git diff --exit-code
