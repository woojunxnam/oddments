name: Refresh T1 R1 Generated Artifacts

on:
  push:
    branches:
      - repair/pre-batch3-legacy-salvage-t1-r1
    paths:
      - .github/workflows/refresh-t1-r1-artifacts.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify repair boundary before generation
        shell: bash
        run: |
          set -euo pipefail
          BASE=c99161a7f3e50bb95491de98f895795989d22a16
          python - <<'PY'
          import subprocess
          base = 'c99161a7f3e50bb95491de98f895795989d22a16'
          changed = set(subprocess.check_output(['git','diff','--name-only',f'{base}..HEAD'], text=True).splitlines())
          expected = {
              'data/questions/ma-q-0028.json',
              'data/questions/ma-q-0032.json',
              'data/questions/ma-q-0036.json',
              '.github/workflows/refresh-t1-r1-artifacts.yml',
          }
          if changed != expected:
              raise SystemExit(f'unexpected pre-generation drift: {sorted(changed)}')
          print('pre-generation repair boundary: PASS')
          PY

      - name: Regenerate deterministic artifacts
        run: python scripts/generate_artifacts.py --write

      - name: Validate repository
        run: python scripts/validate_all.py

      - name: Run full tests
        run: python -m pytest -q

      - name: Enforce generated write boundary
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          lines = subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'], text=True).splitlines()
          paths = {line[3:].split(' -> ')[-1] for line in lines}
          allowed = {
              'duplicate_report.json',
              'answer_distribution_report.json',
              'structural_pattern_report.json',
              'site/generated/questions.json',
          }
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit(f'unexpected generated writes: {unexpected}')
          print(f'generated write boundary: PASS ({len(paths)} paths)')
          PY

      - name: Commit refreshed artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add duplicate_report.json answer_distribution_report.json structural_pattern_report.json site/generated/questions.json
          if git diff --cached --quiet; then
            echo 'no generated artifact changes'
          else
            git commit -m 'generated: refresh T1 r1 artifacts'
            git push origin HEAD:repair/pre-batch3-legacy-salvage-t1-r1
          fi

      - name: Prove exact-head artifact freshness
        run: python scripts/generate_artifacts.py --write && git diff --exit-code
