name: Import quality and chaos implementation
on:
  push:
    branches: ['feat/practice-quality-chaos-20261027']
    paths: ['.github/workflows/quality-import.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/practice-quality-chaos-20261027
          fetch-depth: 1
      - name: Retrieve checksum-pinned application package
        shell: python
        run: |
          import urllib.request, pathlib, zipfile, io, hashlib, json, subprocess
          url='https://sdmntprjapaneast.oaiusercontent.com/files/00000000-d334-8209-be01-80a7823e5f6b/raw?se=2026-10-27T21%3A13%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=571c6a08-c2f0-5ef7-9c07-c5c258dfb3d4&skoid=864daabb-d06a-46b3-a747-d35075313a83&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T20%3A31%3A59Z&ske=2026-10-28T20%3A31%3A59Z&sks=b&skv=2026-02-06&sig=9FiSMf%2BlTQLPVFnujh9gi0LXGCz6qXMDU8dddJbVIJ0%3D'
          with urllib.request.urlopen(url,timeout=40) as r: raw=r.read(3_000_000)
          assert hashlib.sha256(raw).hexdigest()=='67f1ff9c0a2a4d94c1307065ff544728e26cc0057ea014ef0b76edd25281c0f4'
          package=pathlib.Path('/tmp/mpje-quality-package');package.mkdir()
          z=zipfile.ZipFile(io.BytesIO(raw));assert sum(x.file_size for x in z.infolist())<40_000_000
          for x in z.infolist():
              p=pathlib.Path(x.filename)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              if x.filename in ['PATCH_MANIFEST.json','apply_changes.py'] or x.filename.startswith('changes/'):
                  target=package/p;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(z.read(x))
          base='403f370d964e4861e7fb033a737aa98d27194174'
          manifest=json.loads((package/'PATCH_MANIFEST.json').read_text());assert manifest['expected_remote_head']==base
          assert len(manifest['files'])==32
          subprocess.run(['git','fetch','--depth=1','origin',base],check=True)
          subprocess.run(['git','worktree','add','--detach','/tmp/mpje-quality-review',base],check=True)
          subprocess.run(['python',str(package/'apply_changes.py'),'--repo','/tmp/mpje-quality-review','--apply'],check=True)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source contracts and deterministic builds
        working-directory: /tmp/mpje-quality-review
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.57.0
          mkdir -p test-results/quality-deployment
          python -m pytest tests/test_practice_quality.py tests/test_practice_expansion_integration.py tests/test_casebank_plus.py tests/test_exam_study.py tests/test_refresh.py tests/test_ultimate_notes.py practice_expansion/2026-10-23/tests/test_expansion.py -q | tee test-results/quality-deployment/focused-tests.txt
          python scripts/build_exam_study.py --check
          python scripts/build_refresh.py --check
          python scripts/build_ultimate_notes.py --check
          node --check site/practice-expansion/quality-core.js
          python scripts/publish_practice.py --output /tmp/mpje-public-site
          git diff --check
      - name: Existing real-HTTP and real-storage regression
        working-directory: /tmp/mpje-quality-review
        run: |
          python -m playwright install --with-deps chromium
          python scripts/verify_public_practice.py --site /tmp/mpje-public-site
          python scripts/verify_exam_study.py --site /tmp/mpje-public-site
          python scripts/verify_refresh_browser.py --site /tmp/mpje-public-site
          python scripts/verify_notes_browser.py
      - name: Revised cases and repeated chaos occurrences over HTTP
        working-directory: /tmp/mpje-quality-review
        run: |
          python -m http.server 8765 --directory /tmp/mpje-public-site >/tmp/quality-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for n in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/practice-expansion/',timeout=1) as r:assert r.status==200
                  break
              except OSError:
                  if n==49:raise
                  time.sleep(.1)
          PY
          python scripts/verify_quality_reader.py --html /tmp/mpje-public-site/practice-expansion/index.html --base-url http://127.0.0.1:8765 --evidence test-results/practice-quality-http
      - name: Commit only tested content on feature branch
        shell: python
        run: |
          import pathlib,json,hashlib,shutil,subprocess
          review=pathlib.Path('/tmp/mpje-quality-review');package=pathlib.Path('/tmp/mpje-quality-package')
          m=json.loads((package/'PATCH_MANIFEST.json').read_text())
          for name,h in m['protected_hashes'].items():assert hashlib.sha256((review/name).read_bytes()).hexdigest()==h,name
          paths=[]
          for e in m['files']:
              name=e['path'];source=review/name
              assert hashlib.sha256(source.read_bytes()).hexdigest()==e['new_sha256'],name
              if name.startswith('.github/'):continue
              dest=pathlib.Path(name);dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(source,dest);paths.append(name)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*paths],check=True)
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==set(paths),actual.symmetric_difference(paths)
          subprocess.run(['git','commit','-m','feat(practice): reduce repetition, add 96 individual cases and unrestricted chaos ten'],check=True)
          subprocess.run(['git','push','origin','HEAD:feat/practice-quality-chaos-20261027'],check=True)
      - name: Package evidence and exact review tree
        if: always()
        shell: python
        run: |
          import pathlib,zipfile,shutil
          root=pathlib.Path('/tmp/mpje-quality-review');out=pathlib.Path('/tmp/quality-deployment-evidence');out.mkdir(exist_ok=True)
          if root.exists():
              if (root/'test-results').exists():shutil.copytree(root/'test-results',out/'test-results',dirs_exist_ok=True)
              with zipfile.ZipFile(out/'review-tree.zip','w',zipfile.ZIP_DEFLATED) as z:
                  for p in root.rglob('*'):
                      if p.is_file() and not {'.git','.pytest_cache','__pycache__','test-results'}&set(p.relative_to(root).parts):z.write(p,str(p.relative_to(root)))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-chaos-http-evidence
          path: /tmp/quality-deployment-evidence
          retention-days: 7
