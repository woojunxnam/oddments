name: Repair Pre-Batch3 T1 R2

on:
  push:
    branches:
      - repair/pre-batch3-legacy-salvage-t1-r2
    paths:
      - .github/workflows/repair-prebatch3-t1-r2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/pre-batch3-legacy-salvage-t1-r2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify source and tooling-only boundary
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=2f7dcd6b6ea06787e1e0a5dc76f93b0f2fc78eab
          git fetch origin repair/pre-batch3-legacy-salvage-t1-r1
          test "$(git rev-parse origin/repair/pre-batch3-legacy-salvage-t1-r1)" = "$SOURCE"
          test "$(git merge-base "$SOURCE" HEAD)" = "$SOURCE"
          python - <<'PY'
          import subprocess
          source = '2f7dcd6b6ea06787e1e0a5dc76f93b0f2fc78eab'
          changed = set(subprocess.check_output(['git','diff','--name-only',f'{source}...HEAD'], text=True).splitlines())
          expected = {
              'scripts/repair_prebatch3_t1_r2.py',
              '.github/workflows/repair-prebatch3-t1-r2.yml',
          }
          if changed != expected:
              raise SystemExit(f'unexpected pre-repair diff: {sorted(changed)}')
          print('tooling-only repair boundary: PASS')
          PY

      - name: Apply four-question repair
        run: python scripts/repair_prebatch3_t1_r2.py

      - name: Regenerate deterministic artifacts
        run: python scripts/generate_artifacts.py --write

      - name: Validate repaired repository
        run: python scripts/validate_all.py

      - name: Run full tests
        run: python -m pytest -q

      - name: Remove temporary repair tooling
        run: git rm scripts/repair_prebatch3_t1_r2.py .github/workflows/repair-prebatch3-t1-r2.yml

      - name: Enforce final repair diff boundary
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=2f7dcd6b6ea06787e1e0a5dc76f93b0f2fc78eab
          python - <<'PY'
          import subprocess
          source = '2f7dcd6b6ea06787e1e0a5dc76f93b0f2fc78eab'
          changed = set(subprocess.check_output(['git','diff','--name-only',source], text=True).splitlines())
          required_questions = {
              'data/questions/ma-q-0079.json',
              'data/questions/ma-q-0082.json',
              'data/questions/ma-q-0083.json',
              'data/questions/ma-q-0084.json',
          }
          actual_questions = {p for p in changed if p.startswith('data/questions/')}
          if actual_questions != required_questions:
              raise SystemExit(f'question repair boundary mismatch: {sorted(actual_questions)}')
          allowed_generated = {
              'duplicate_report.json',
              'answer_distribution_report.json',
              'structural_pattern_report.json',
              'site/generated/questions.json',
          }
          unexpected = changed - required_questions - allowed_generated
          if unexpected:
              raise SystemExit(f'unexpected final repair paths: {sorted(unexpected)}')
          blocked = [p for p in changed if p.startswith('data/rules/') or p.startswith('data/drugs/') or p == 'data/blueprint.json' or p == 'data/exam_style/mpje_style_profile.json' or p == 'data/questions/ma-q-0028.json' or p == 'data/questions/ma-q-0190.json']
          if blocked:
              raise SystemExit(f'blocked repair mutation: {blocked}')
          print(f'final repair boundary PASS: {len(changed)} changed paths; exactly four substantive question files')
          PY

      - name: Stage repaired state
        run: git add -A

      - name: Prove generated-artifact freshness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_artifacts.py --write
          git diff --exit-code

      - name: Commit repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "repair: resolve T1 current-hash audit blockers"

      - name: Push repaired candidate
        run: git push origin HEAD:repair/pre-batch3-legacy-salvage-t1-r2
