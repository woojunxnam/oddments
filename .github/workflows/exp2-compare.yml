name: EXP2 Blind Answer Comparison

on:
  push:
    branches:
      - audit/gpt-fresh-exp2-a-q0131-0210
    paths:
      - '.github/workflows/exp2-compare.yml'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/gpt-fresh-exp2-a-q0131-0210
          fetch-depth: 0
      - name: Compare after blind answer freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('audits/work/2026-08-15/EXP2-GPT-A-INDEPENDENT-ANSWERS.json')
          independent=json.loads(src.read_text())['answers']
          rows=[]
          mismatches=[]
          for n in range(131,211):
              qid=f'MA-Q-{n:04d}'
              q=json.loads(Path(f'data/questions/ma-q-{n:04d}.json').read_text())
              key=q['correct_choice_ids']
              ind=independent[qid]
              row={'question_id':qid,'frozen_key':key,'independent_answer':ind,'match':key==ind}
              rows.append(row)
              if not row['match']:
                  mismatches.append(row)
          out={'frozen_author_candidate_sha':'d7cc340a87781f261071325b7366d118cbd7bd84','blind_answer_commit':'fffe7d9489e0183407843268241a9156f59cbcee','question_count':80,'match_count':80-len(mismatches),'mismatch_count':len(mismatches),'mismatches':mismatches,'all_comparisons':rows}
          p=Path('audits/work/2026-08-15/EXP2-GPT-A-KEY-COMPARISON.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print('matches',80-len(mismatches),'mismatches',len(mismatches))
          for r in mismatches: print(r)
          PY
      - name: Commit report and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'exp2-audit-compare-bot'
          git config user.email 'exp2-audit-compare-bot@users.noreply.github.com'
          git rm .github/workflows/exp2-compare.yml
          git add audits/work/2026-08-15/EXP2-GPT-A-KEY-COMPARISON.json
          git commit -m 'audit(exp2): compare blind answers with frozen keys'
          git push origin HEAD:audit/gpt-fresh-exp2-a-q0131-0210
