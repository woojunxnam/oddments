name: Next40 read-only duplicate screen
on:
  pull_request:
    paths:
      - 'scripts/next40_duplicate_screen.py'
      - 'tests/test_next40_duplicate_screen.py'
      - '.github/workflows/next40-duplicate-screen.yml'
  push:
    branches:
      - 'audit/next40-screen-20261106'
    paths:
      - 'scripts/next40_duplicate_screen.py'
      - 'tests/test_next40_duplicate_screen.py'
      - '.github/workflows/next40-duplicate-screen.yml'
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scanner unit tests
        run: python -m pip install pytest && python -m pytest tests/test_next40_duplicate_screen.py -q
      - name: Screen entire stored public question JSON corpus
        run: python scripts/next40_duplicate_screen.py --root . --output /tmp/next40-duplicate-screen.json --limit 15
      - name: Preserve read-only research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next40-readonly-duplicate-screen
          path: /tmp/next40-duplicate-screen.json
          retention-days: 14
