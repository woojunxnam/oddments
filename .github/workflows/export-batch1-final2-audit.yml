name: Export Batch 1 final-two audit packages

on:
  push:
    branches:
      - repair/mpje-expansion-batch1-final2
    paths:
      - .github/workflows/export-batch1-final2-audit.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out final-two repair branch
        uses: actions/checkout@v6
        with:
          ref: repair/mpje-expansion-batch1-final2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate repair before freezing packages
        run: |
          python scripts/validate_all.py
          python -m pytest -q

      - name: Export exact Q0098 and Q0110 inputs
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from qa_common import DATA, load_json, question_audit_hash, write_json
          from release_context import style_profile_snapshot

          ids = ['MA-Q-0098', 'MA-Q-0110']
          questions = [load_json(DATA / 'questions' / f'ma-q-{qid[-4:]}.json') for qid in ids]
          for q in questions:
              assert q['verification_status'] == 'AUDIT_PENDING'
              assert q['lifecycle_status'] == 'AUDIT_PENDING'
              assert q['audits'] == []
              assert q['final_adjudication'] is None
          hashes = {q['question_id']: question_audit_hash(q) for q in questions}

          outdir = Path('audits/reaudit/2026-08-14')
          outdir.mkdir(parents=True, exist_ok=True)
          legal_fields = ['Question_ID','Verdict','Severity','Existing_Answer_Correct','authorities','Problem','Proposed_Answer','Proposed_Rewrite','Proposed_Explanation']
          realism_fields = ['Question_ID','Verdict','Severity','Realism_Verdict','Reviewed_Date','Criteria','Notes']

          def package(audit_id, review_type, filename):
              payload = {
                  'audit_id': audit_id,
                  'auditor': 'GPT',
                  'auditor_instance': 'GPT-FRESH-EXP1-FINAL2-A',
                  'audit_date': '2026-08-14',
                  'audit_scope': 'REAUDIT',
                  'review_type': review_type,
                  'independent': True,
                  'audit_status': 'STRUCTURAL_TRIAGE_ONLY',
                  'question_ids': ids,
                  'question_hashes': hashes,
                  'questions': questions,
                  'result_contract': {
                      'required_fields': legal_fields if review_type == 'LEGAL_VERIFICATION' else realism_fields,
                      'warning': 'STRUCTURAL_TRIAGE_ONLY cannot satisfy release. Auditor must independently review current official sources and must not modify canonical questions.',
                  },
              }
              if review_type == 'REALISM_REVIEW':
                  payload['style_profile'] = style_profile_snapshot(load_json(DATA / 'exam_style' / 'mpje_style_profile.json'))
              write_json(outdir / filename, payload)

          package('AUDIT-GPT-FRESH-EXP1-FINAL2-A-LEGAL-REAUDIT-2026-08-14', 'LEGAL_VERIFICATION', 'GPT-A-LEGAL-EXP1-FINAL2-Q0098-Q0110.json')
          package('AUDIT-GPT-FRESH-EXP1-FINAL2-A-REALISM-REAUDIT-2026-08-14', 'REALISM_REVIEW', 'GPT-A-REALISM-EXP1-FINAL2-Q0098-Q0110.json')
          print('frozen hashes:', hashes)
          PY

      - name: Verify package and public boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('audits/reaudit/2026-08-14/GPT-A-LEGAL-EXP1-FINAL2-Q0098-Q0110.json'),
              Path('audits/reaudit/2026-08-14/GPT-A-REALISM-EXP1-FINAL2-Q0098-Q0110.json'),
          ]
          docs = [json.loads(p.read_text()) for p in paths]
          assert docs[0]['question_ids'] == docs[1]['question_ids'] == ['MA-Q-0098','MA-Q-0110']
          assert docs[0]['question_hashes'] == docs[1]['question_hashes']
          allow = json.loads(Path('site/generated/preview_allowlist.json').read_text())
          assert len(allow['question_ids']) == 85
          assert 'MA-Q-0098' not in allow['question_ids'] and 'MA-Q-0110' not in allow['question_ids']
          print('final-two package agreement PASS; preview remains 85')
          PY
          python scripts/validate_all.py
          python -m pytest -q

      - name: Commit packages and remove one-shot workflow
        run: |
          rm .github/workflows/export-batch1-final2-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "audit: freeze Batch 1 final-two re-audit packages"
          git push origin HEAD:repair/mpje-expansion-batch1-final2
