name: Freeze Pre-Batch3 Legacy Salvage T1 R2 V1

on:
  push:
    branches:
      - freeze/pre-batch3-legacy-salvage-t1-r2-v1
    paths:
      - .github/workflows/freeze-pre-batch3-legacy-salvage-t1-r2-v1.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean changed-item freeze branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: freeze/pre-batch3-legacy-salvage-t1-r2-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify clean freeze starting boundary
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=5c048473356292f855c14fe53c78273c11d2334a
          git fetch origin repair/pre-batch3-legacy-salvage-t1-r2
          test "$(git rev-parse origin/repair/pre-batch3-legacy-salvage-t1-r2)" = "$CANDIDATE"
          test "$(git merge-base "$CANDIDATE" HEAD)" = "$CANDIDATE"
          python - <<'PY'
          import subprocess
          candidate = '5c048473356292f855c14fe53c78273c11d2334a'
          changed = set(subprocess.check_output(['git','diff','--name-only',f'{candidate}...HEAD'], text=True).splitlines())
          expected = {
              'scripts/freeze_legacy_salvage_t1_r2_v1.py',
              'scripts/verify_prebatch3_t1_r2_v1_freeze.py',
              '.github/workflows/freeze-pre-batch3-legacy-salvage-t1-r2-v1.yml',
          }
          if changed != expected:
              raise SystemExit(f'unexpected clean-freeze starting diff: {sorted(changed)}')
          print('clean freeze starting boundary: PASS')
          PY

      - name: Generate sanitized changed-item frozen inputs
        run: python scripts/freeze_legacy_salvage_t1_r2_v1.py

      - name: Enforce freeze write boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          candidate = '5c048473356292f855c14fe53c78273c11d2334a'
          changed = set(subprocess.check_output(['git','diff','--name-only',candidate], text=True).splitlines())
          untracked = set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          expected_tooling = {
              'scripts/freeze_legacy_salvage_t1_r2_v1.py',
              'scripts/verify_prebatch3_t1_r2_v1_freeze.py',
              '.github/workflows/freeze-pre-batch3-legacy-salvage-t1-r2-v1.yml',
          }
          expected_inputs = {
              'audits/remediation/2026-08-17/GPT-E-BLIND-QUESTIONS-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json',
              'audits/remediation/2026-08-17/GPT-E-LEGAL-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json',
              'audits/remediation/2026-08-17/GPT-E-REALISM-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json',
              'audits/remediation/2026-08-17/PRE-BATCH3-LEGACY-SALVAGE-T1-R2-CLEAN-FREEZE-V1-MANIFEST.json',
          }
          if changed != expected_tooling:
              raise SystemExit(f'freeze modified tracked candidate content: {sorted(changed)}')
          if untracked != expected_inputs:
              raise SystemExit(f'unexpected generated freeze inputs: {sorted(untracked)}')
          print('freeze write boundary: PASS')
          PY

      - name: Verify sanitized freeze mechanically
        run: python scripts/verify_prebatch3_t1_r2_v1_freeze.py

      - name: Validate repository
        run: python scripts/validate_all.py

      - name: Run full tests
        run: python -m pytest -q

      - name: Prove generated-artifact freshness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_artifacts.py --write
          git diff --exit-code

      - name: Commit sanitized changed-item frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            audits/remediation/2026-08-17/GPT-E-BLIND-QUESTIONS-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json \
            audits/remediation/2026-08-17/GPT-E-LEGAL-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json \
            audits/remediation/2026-08-17/GPT-E-REALISM-PRE-BATCH3-LEGACY-SALVAGE-T1-R2.json \
            audits/remediation/2026-08-17/PRE-BATCH3-LEGACY-SALVAGE-T1-R2-CLEAN-FREEZE-V1-MANIFEST.json
          git commit -m "freeze: add clean T1 R2 auditor E inputs"

      - name: Push sanitized frozen inputs
        run: git push origin HEAD:freeze/pre-batch3-legacy-salvage-t1-r2-v1
