name: Ultimate notes reader QA
on:
  push:
    paths:
      - "notes/**"
      - "revisions/**"
      - "scripts/notes_revision.py"
      - "site/notes/**"
      - "site/index.html"
      - "site/notes-entry.css"
      - "scripts/build_ultimate_notes.py"
      - "scripts/verify_notes_browser.py"
      - "tests/test_ultimate_notes.py"
      - "requirements-notes.txt"
      - ".github/workflows/notes-qa.yml"
  pull_request:
    paths:
      - "notes/**"
      - "revisions/**"
      - "scripts/notes_revision.py"
      - "site/notes/**"
      - "site/index.html"
      - "site/notes-entry.css"
      - "scripts/build_ultimate_notes.py"
      - "scripts/verify_notes_browser.py"
      - "tests/test_ultimate_notes.py"
      - "requirements-notes.txt"
      - ".github/workflows/notes-qa.yml"
permissions:
  contents: read
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned renderer and browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Validate notes source map and deterministic artifacts
        run: |
          python -m pytest tests/test_ultimate_notes.py -q
          python scripts/build_ultimate_notes.py --check
          node --check site/notes/notes.js
      - name: Exercise HTTP navigation, storage and responsive UI
        run: python scripts/verify_notes_browser.py
      - name: Retain screenshots and browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-notes-browser-review
          path: test-results/ultimate-notes
          retention-days: 7
