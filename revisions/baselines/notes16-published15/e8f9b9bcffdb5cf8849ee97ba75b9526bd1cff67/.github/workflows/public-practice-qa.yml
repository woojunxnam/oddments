name: Online practice release QA
on:
  push:
    paths:
      - 'practice_expansion/**'
      - 'site/**'
      - 'notes/guide.json'
      - 'scripts/publish_practice.py'
      - 'scripts/verify_public_practice.py'
      - 'tests/test_practice_expansion_integration.py'
      - 'tests/test_casebank_plus.py'
      - '.github/workflows/public-practice-qa.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'practice_expansion/**'
      - 'site/**'
      - 'notes/guide.json'
      - 'scripts/publish_practice.py'
      - 'scripts/verify_public_practice.py'
      - 'tests/test_practice_expansion_integration.py'
      - 'tests/test_casebank_plus.py'
      - '.github/workflows/public-practice-qa.yml'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
jobs:
  public-practice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate unchanged content and enabled online edition
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.57.0
          python practice_expansion/2026-10-26-plus/scripts/build_casebank.py --check
          python -m pytest tests/test_casebank_plus.py tests/test_practice_expansion_integration.py practice_expansion/2026-10-23/tests/test_expansion.py tests/test_ultimate_notes.py -q
          python scripts/publish_practice.py --output /tmp/mpje-public-site
          git diff --exit-code
      - name: Exercise the real HTTP page
        run: |
          python -m playwright install --with-deps chromium
          python scripts/verify_public_practice.py --site /tmp/mpje-public-site
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-practice-browser-review
          path: test-results/public-practice
          retention-days: 7
